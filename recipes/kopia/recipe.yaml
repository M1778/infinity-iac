{
  "api_version": "recipe/v1",
  "version": "1.1.0",
  "kind": "application",
  "supports": {
    "providers": [
      "oracle"
    ],
    "os": [
      "ubuntu-24.04",
      "ubuntu-22.04"
    ],
    "architectures": [
      "amd64",
      "arm64"
    ]
  },
  "name": "kopia",
  "description": "Encrypted backup system.",
  "inputs": {
    "port": {
      "type": "integer",
      "description": "Loopback host port; connect through an SSH tunnel or an authenticated reverse proxy.",
      "default": 51515,
      "min": 1,
      "max": 65535
    }
  },
  "resources": {
    "specs": "auto",
    "cpu": 2,
    "ram_gb": 2,
    "storage_gb": 30,
    "ingress": [
      {
        "port": 51515,
        "protocol": "tcp",
        "source": "loopback"
      }
    ]
  },
  "steps": [
    {
      "id": "install-docker",
      "type": "package",
      "package": "docker.io"
    },
    {
      "id": "install-curl",
      "type": "package",
      "package": "curl"
    },
    {
      "id": "install-openssl",
      "type": "package",
      "package": "openssl"
    },
    {
      "id": "start-kopia",
      "type": "command",
      "command": "recipe='kopia'\nowned_volume() {\n  if docker volume inspect \"$1\" >/dev/null 2>&1; then\n    owner=$(docker volume inspect -f '{{ index .Labels \"infinity-iac-recipe\" }}' \"$1\")\n    [ \"$owner\" = \"$recipe\" ] || { printf '%s\\n' 'Refusing unowned volume' >&2; exit 1; }\n  else\n    docker volume create --label \"infinity-iac-recipe=$recipe\" \"$1\" >/dev/null\n  fi\n}\nreplace_container() {\n  if docker inspect \"$1\" >/dev/null 2>&1; then\n    owner=$(docker inspect -f '{{ index .Config.Labels \"infinity-iac-recipe\" }}' \"$1\")\n    [ \"$owner\" = \"$recipe\" ] || { printf '%s\\n' 'Refusing unowned container' >&2; exit 1; }\n    docker rm -f \"$1\" >/dev/null\n  fi\n}\nowned_volume 'infinity-kopia-config'\nowned_volume 'infinity-kopia-cache'\nowned_volume 'infinity-kopia-repository'\ninstall -d -m 0700 /var/lib/infinity-iac/kopia\ncredentials=/var/lib/infinity-iac/kopia/credentials.env\ntest ! -L \"$credentials\"\nif [ ! -e \"$credentials\" ]; then\n  umask 077\n  tmp=$(mktemp \"${credentials}.XXXXXX\")\n  trap 'rm -f -- \"$tmp\"' EXIT\n  printf '%s=%s\\n' 'KOPIA_PASSWORD' \"$(openssl rand -hex 32)\" >> \"$tmp\"\n  printf '%s=%s\\n' 'KOPIA_SERVER_USERNAME' \"infinity\" >> \"$tmp\"\n  printf '%s=%s\\n' 'KOPIA_SERVER_PASSWORD' \"$(openssl rand -hex 32)\" >> \"$tmp\"\n  chmod 0600 \"$tmp\"\n  mv -- \"$tmp\" \"$credentials\"\n  trap - EXIT\nfi\nchmod 0600 \"$credentials\"\nkopia_volume_mount=$(docker volume inspect -f '{{.Mountpoint}}' infinity-kopia-config)\nif [ ! -f \"$kopia_volume_mount/repository.config\" ]; then\n  set -a; . \"$credentials\"; set +a\n  docker run --rm --label infinity-iac-recipe=kopia --env-file \"$credentials\" -v infinity-kopia-config:/app/config -v infinity-kopia-repository:/repository kopia/kopia@sha256:89fd95ee2942880ca00eae964266958a394421ddbdf69bca62e38afc55f5900e repository create filesystem --path=/repository\nfi\nreplace_container kopia\ndocker run -d --restart unless-stopped --label infinity-iac-recipe=kopia --name kopia -v infinity-kopia-config:/app/config -v infinity-kopia-cache:/app/cache -v infinity-kopia-repository:/repository --env-file \"$credentials\" -p 127.0.0.1:{{port}}:51515 kopia/kopia@sha256:89fd95ee2942880ca00eae964266958a394421ddbdf69bca62e38afc55f5900e server start --address=0.0.0.0:51515 --insecure --without-password=false\n",
      "timeout_seconds": 1200
    }
  ],
  "health": [
    {
      "type": "command",
      "command": "set -a; . /var/lib/infinity-iac/kopia/credentials.env; set +a; curl --fail --silent --show-error --user \"$KOPIA_SERVER_USERNAME:$KOPIA_SERVER_PASSWORD\" http://127.0.0.1:{{port}}/ >/dev/null",
      "timeout_seconds": 240
    }
  ],
  "outputs": {
    "url": {
      "type": "string",
      "value": "http://127.0.0.1:{{port}}"
    },
    "credentials_file": {
      "type": "string",
      "value": "/var/lib/infinity-iac/kopia/credentials.env",
      "sensitive": true
    }
  },
  "status": "experimental",
  "requirements": [
    "Encrypted filesystem repository and authenticated local HTTP UI; credentials live privately on the instance.",
    "Add authorized snapshot sources and an independent backup destination. Deleting the VM destroys the local repository."
  ]
}
