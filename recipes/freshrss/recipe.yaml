{
  "api_version": "recipe/v1",
  "version": "1.1.0",
  "kind": "application",
  "supports": {
    "providers": [
      "oracle"
    ],
    "os": [
      "ubuntu-24.04",
      "ubuntu-22.04"
    ],
    "architectures": [
      "amd64",
      "arm64"
    ]
  },
  "name": "freshrss",
  "description": "RSS feed reader.",
  "inputs": {
    "port": {
      "type": "integer",
      "description": "Loopback host port; use an SSH tunnel or an authenticated reverse proxy.",
      "default": 80,
      "min": 1,
      "max": 65535
    }
  },
  "resources": {
    "specs": "ibase2",
    "cpu": 2,
    "ram_gb": 2,
    "storage_gb": 30,
    "ingress": [
      {
        "port": 80,
        "protocol": "tcp",
        "source": "loopback"
      }
    ]
  },
  "steps": [
    {
      "id": "install-docker",
      "type": "package",
      "package": "docker.io"
    },
    {
      "id": "start-freshrss",
      "type": "command",
      "command": "if docker volume inspect infinity-freshrss-data >/dev/null 2>&1; then\n  owner=$(docker volume inspect -f '{{ index .Labels \"infinity-iac-recipe\" }}' infinity-freshrss-data)\n  [ \"$owner\" = freshrss ] || { echo \"Refusing unowned volume\" >&2; exit 1; }\nelse\n  docker volume create --label infinity-iac-recipe=freshrss infinity-freshrss-data >/dev/null\nfi\nif docker volume inspect infinity-freshrss-extensions >/dev/null 2>&1; then\n  owner=$(docker volume inspect -f '{{ index .Labels \"infinity-iac-recipe\" }}' infinity-freshrss-extensions)\n  [ \"$owner\" = freshrss ] || { echo \"Refusing unowned volume\" >&2; exit 1; }\nelse\n  docker volume create --label infinity-iac-recipe=freshrss infinity-freshrss-extensions >/dev/null\nfi\nif docker inspect freshrss >/dev/null 2>&1; then\n  owner=$(docker inspect -f '{{ index .Config.Labels \"infinity-iac-recipe\" }}' freshrss)\n  [ \"$owner\" = freshrss ] || { echo \"Refusing unowned container\" >&2; exit 1; }\n  docker rm -f freshrss >/dev/null\nfi\ndocker run -d --restart unless-stopped --name freshrss --label infinity-iac-recipe=freshrss -v infinity-freshrss-data:/var/www/FreshRSS/data -v infinity-freshrss-extensions:/var/www/FreshRSS/extensions -e CRON_MIN=13,43 -p 127.0.0.1:{{port}}:80 freshrss/freshrss:latest",
      "timeout_seconds": 900
    }
  ],
  "health": [
    {
      "type": "http",
      "port": 80,
      "path": "/",
      "timeout_seconds": 180
    }
  ],
  "outputs": {
    "url": {
      "type": "string",
      "value": "http://127.0.0.1:{{port}}"
    }
  },
  "status": "experimental"
}
