{
  "api_version": "recipe/v1",
  "version": "1.1.0",
  "kind": "application",
  "supports": {
    "providers": [
      "oracle"
    ],
    "os": [
      "ubuntu-24.04",
      "ubuntu-22.04"
    ],
    "architectures": [
      "amd64",
      "arm64"
    ]
  },
  "name": "jupyter",
  "description": "Interactive notebooks.",
  "inputs": {
    "port": {
      "type": "integer",
      "description": "Loopback host port; connect through an SSH tunnel or an authenticated reverse proxy.",
      "default": 8888,
      "min": 1,
      "max": 65535
    }
  },
  "resources": {
    "specs": "auto",
    "cpu": 2,
    "ram_gb": 2,
    "storage_gb": 30,
    "ingress": [
      {
        "port": 8888,
        "protocol": "tcp",
        "source": "loopback"
      }
    ]
  },
  "steps": [
    {
      "id": "install-docker",
      "type": "package",
      "package": "docker.io"
    },
    {
      "id": "install-openssl",
      "type": "package",
      "package": "openssl"
    },
    {
      "id": "start-jupyter",
      "type": "command",
      "command": "recipe='jupyter'\nowned_volume() {\n  if docker volume inspect \"$1\" >/dev/null 2>&1; then\n    owner=$(docker volume inspect -f '{{ index .Labels \"infinity-iac-recipe\" }}' \"$1\")\n    [ \"$owner\" = \"$recipe\" ] || { printf '%s\\n' 'Refusing unowned volume' >&2; exit 1; }\n  else\n    docker volume create --label \"infinity-iac-recipe=$recipe\" \"$1\" >/dev/null\n  fi\n}\nreplace_container() {\n  if docker inspect \"$1\" >/dev/null 2>&1; then\n    owner=$(docker inspect -f '{{ index .Config.Labels \"infinity-iac-recipe\" }}' \"$1\")\n    [ \"$owner\" = \"$recipe\" ] || { printf '%s\\n' 'Refusing unowned container' >&2; exit 1; }\n    docker rm -f \"$1\" >/dev/null\n  fi\n}\nowned_volume 'infinity-jupyter-work'\ninstall -d -m 0700 /var/lib/infinity-iac/jupyter\ncredentials=/var/lib/infinity-iac/jupyter/credentials.env\ntest ! -L \"$credentials\"\nif [ ! -e \"$credentials\" ]; then\n  umask 077\n  tmp=$(mktemp \"${credentials}.XXXXXX\")\n  trap 'rm -f -- \"$tmp\"' EXIT\n  printf '%s=%s\\n' 'JUPYTER_TOKEN' \"$(openssl rand -hex 32)\" >> \"$tmp\"\n  chmod 0600 \"$tmp\"\n  mv -- \"$tmp\" \"$credentials\"\n  trap - EXIT\nfi\nchmod 0600 \"$credentials\"\nreplace_container jupyter\ndocker run -d --restart unless-stopped --label infinity-iac-recipe=jupyter --name jupyter -v infinity-jupyter-work:/home/jovyan/work -e CHOWN_HOME=\"yes\" -e CHOWN_HOME_OPTS=\"-R\" --env-file \"$credentials\" --user root -p 127.0.0.1:{{port}}:8888 quay.io/jupyter/scipy-notebook:2026-10-26\n",
      "timeout_seconds": 1200
    }
  ],
  "health": [
    {
      "type": "command",
      "command": "docker exec jupyter python -c 'import os,urllib.request; request=urllib.request.Request(\"http://127.0.0.1:8888/api/status\",headers={\"Authorization\":\"token \"+os.environ[\"JUPYTER_TOKEN\"]}); urllib.request.urlopen(request,timeout=10).read()'",
      "timeout_seconds": 240
    }
  ],
  "outputs": {
    "url": {
      "type": "string",
      "value": "http://127.0.0.1:{{port}}"
    },
    "credentials_file": {
      "type": "string",
      "value": "/var/lib/infinity-iac/jupyter/credentials.env",
      "sensitive": true
    }
  },
  "status": "experimental",
  "requirements": [
    "Token-authenticated scientific notebook; credentials stay in the mode-0600 file and notebooks persist in the owned work volume.",
    "No GPUs, host mounts or remote kernels are configured. Execute only trusted notebooks."
  ]
}
