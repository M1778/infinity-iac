{
  "api_version": "recipe/v1",
  "name": "system-report",
  "version": "1.0.0",
  "kind": "script",
  "status": "experimental",
  "description": "Read-only operating-system, CPU, memory, filesystem, and socket diagnostics.",
  "supports": {
    "providers": [
      "oracle"
    ],
    "os": [
      "ubuntu-24.04",
      "ubuntu-22.04"
    ],
    "architectures": [
      "amd64",
      "arm64"
    ]
  },
  "resources": {
    "cpu": 1,
    "ram_gb": 1,
    "storage_gb": 30
  },
  "steps": [
    {
      "id": "report",
      "type": "command",
      "command": "uname -a\nfree -m\ndf -h\nss -lntup",
      "timeout_seconds": 60
    }
  ]
}
