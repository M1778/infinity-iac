{
  "api_version": "recipe/v1",
  "version": "1.1.0",
  "kind": "application",
  "supports": {
    "providers": [
      "oracle"
    ],
    "os": [
      "ubuntu-24.04",
      "ubuntu-22.04"
    ],
    "architectures": [
      "amd64",
      "arm64"
    ]
  },
  "name": "influxdb",
  "description": "Time-series database.",
  "inputs": {
    "port": {
      "type": "integer",
      "description": "Loopback host port; connect through an SSH tunnel or an authenticated reverse proxy.",
      "default": 8086,
      "min": 1,
      "max": 65535
    }
  },
  "resources": {
    "specs": "auto",
    "cpu": 2,
    "ram_gb": 2,
    "storage_gb": 30,
    "ingress": [
      {
        "port": 8086,
        "protocol": "tcp",
        "source": "loopback"
      }
    ]
  },
  "steps": [
    {
      "id": "install-docker",
      "type": "package",
      "package": "docker.io"
    },
    {
      "id": "install-openssl",
      "type": "package",
      "package": "openssl"
    },
    {
      "id": "start-influxdb",
      "type": "command",
      "command": "recipe='influxdb'\nowned_volume() {\n  if docker volume inspect \"$1\" >/dev/null 2>&1; then\n    owner=$(docker volume inspect -f '{{ index .Labels \"infinity-iac-recipe\" }}' \"$1\")\n    [ \"$owner\" = \"$recipe\" ] || { printf '%s\\n' 'Refusing unowned volume' >&2; exit 1; }\n  else\n    docker volume create --label \"infinity-iac-recipe=$recipe\" \"$1\" >/dev/null\n  fi\n}\nreplace_container() {\n  if docker inspect \"$1\" >/dev/null 2>&1; then\n    owner=$(docker inspect -f '{{ index .Config.Labels \"infinity-iac-recipe\" }}' \"$1\")\n    [ \"$owner\" = \"$recipe\" ] || { printf '%s\\n' 'Refusing unowned container' >&2; exit 1; }\n    docker rm -f \"$1\" >/dev/null\n  fi\n}\nowned_volume 'infinity-influxdb-data'\nowned_volume 'infinity-influxdb-config'\ninstall -d -m 0700 /var/lib/infinity-iac/influxdb\ncredentials=/var/lib/infinity-iac/influxdb/credentials.env\ntest ! -L \"$credentials\"\nif [ ! -e \"$credentials\" ]; then\n  umask 077\n  tmp=$(mktemp \"${credentials}.XXXXXX\")\n  trap 'rm -f -- \"$tmp\"' EXIT\n  printf '%s=%s\\n' 'DOCKER_INFLUXDB_INIT_MODE' \"setup\" >> \"$tmp\"\n  printf '%s=%s\\n' 'DOCKER_INFLUXDB_INIT_USERNAME' \"infinity\" >> \"$tmp\"\n  printf '%s=%s\\n' 'DOCKER_INFLUXDB_INIT_PASSWORD' \"$(openssl rand -hex 32)\" >> \"$tmp\"\n  printf '%s=%s\\n' 'DOCKER_INFLUXDB_INIT_ORG' \"infinity\" >> \"$tmp\"\n  printf '%s=%s\\n' 'DOCKER_INFLUXDB_INIT_BUCKET' \"infinity\" >> \"$tmp\"\n  printf '%s=%s\\n' 'DOCKER_INFLUXDB_INIT_ADMIN_TOKEN' \"$(openssl rand -hex 32)\" >> \"$tmp\"\n  chmod 0600 \"$tmp\"\n  mv -- \"$tmp\" \"$credentials\"\n  trap - EXIT\nfi\nchmod 0600 \"$credentials\"\nreplace_container influxdb\ndocker run -d --restart unless-stopped --label infinity-iac-recipe=influxdb --name influxdb -v infinity-influxdb-data:/var/lib/influxdb2 -v infinity-influxdb-config:/etc/influxdb2 --env-file \"$credentials\" -p 127.0.0.1:{{port}}:8086 influxdb@sha256:cc8083573dc3969c191d1bfb768954eaf7a4c615af12e661034fd4f63c7b5570\n",
      "timeout_seconds": 1200
    }
  ],
  "health": [
    {
      "type": "command",
      "command": "docker exec influxdb influx ping --host http://127.0.0.1:8086",
      "timeout_seconds": 240
    }
  ],
  "outputs": {
    "url": {
      "type": "string",
      "value": "http://127.0.0.1:{{port}}"
    },
    "credentials_file": {
      "type": "string",
      "value": "/var/lib/infinity-iac/influxdb/credentials.env",
      "sensitive": true
    }
  },
  "status": "experimental",
  "requirements": [
    "Bootstrap username, password and token are persisted in the owner-only credentials.env file; do not publish that file."
  ]
}
