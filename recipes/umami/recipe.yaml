{
  "api_version": "recipe/v1",
  "version": "1.1.0",
  "kind": "application",
  "supports": {
    "providers": [
      "oracle"
    ],
    "os": [
      "ubuntu-24.04",
      "ubuntu-22.04"
    ],
    "architectures": [
      "amd64",
      "arm64"
    ]
  },
  "name": "umami",
  "description": "Privacy-focused analytics.",
  "inputs": {
    "port": {
      "type": "integer",
      "description": "Loopback host port; connect through an SSH tunnel or an authenticated reverse proxy.",
      "default": 3000,
      "min": 1,
      "max": 65535
    }
  },
  "resources": {
    "specs": "auto",
    "cpu": 2,
    "ram_gb": 3,
    "storage_gb": 30,
    "ingress": [
      {
        "port": 3000,
        "protocol": "tcp",
        "source": "loopback"
      }
    ]
  },
  "steps": [
    {
      "id": "install-docker",
      "type": "package",
      "package": "docker.io"
    },
    {
      "id": "install-openssl",
      "type": "package",
      "package": "openssl"
    },
    {
      "id": "start-umami-stack",
      "type": "command",
      "command": "recipe='umami'\nowned_volume() {\n  if docker volume inspect \"$1\" >/dev/null 2>&1; then\n    owner=$(docker volume inspect -f '{{ index .Labels \"infinity-iac-recipe\" }}' \"$1\")\n    [ \"$owner\" = \"$recipe\" ] || { printf '%s\\n' 'Refusing unowned volume' >&2; exit 1; }\n  else\n    docker volume create --label \"infinity-iac-recipe=$recipe\" \"$1\" >/dev/null\n  fi\n}\nowned_network() {\n  if docker network inspect \"$1\" >/dev/null 2>&1; then\n    owner=$(docker network inspect -f '{{ index .Labels \"infinity-iac-recipe\" }}' \"$1\")\n    [ \"$owner\" = \"$recipe\" ] || { printf '%s\\n' 'Refusing unowned network' >&2; exit 1; }\n  else\n    docker network create --label \"infinity-iac-recipe=$recipe\" \"$1\" >/dev/null\n  fi\n}\nreplace_container() {\n  if docker inspect \"$1\" >/dev/null 2>&1; then\n    owner=$(docker inspect -f '{{ index .Config.Labels \"infinity-iac-recipe\" }}' \"$1\")\n    [ \"$owner\" = \"$recipe\" ] || { printf '%s\\n' 'Refusing unowned container' >&2; exit 1; }\n    docker rm -f \"$1\" >/dev/null\n  fi\n}\nwait_for() {\n  local deadline=$((SECONDS + 180))\n  until \"$@\" >/dev/null 2>&1; do\n    (( SECONDS < deadline )) || { printf '%s\\n' 'Dependency readiness timed out' >&2; exit 1; }\n    sleep 3\n  done\n}\nowned_network infinity-umami-network\nowned_volume infinity-umami-database\nowned_volume infinity-umami-data\ninstall -d -m 0700 /var/lib/infinity-iac/umami\ncredentials=/var/lib/infinity-iac/umami/credentials.env\ntest ! -L \"$credentials\"\nif [ ! -e \"$credentials\" ]; then\n  umask 077\n  tmp=$(mktemp \"${credentials}.XXXXXX\")\n  trap 'rm -f -- \"$tmp\"' EXIT\n  printf '%s=%s\\n' 'POSTGRES_USER' \"infinity\" >> \"$tmp\"\n  printf '%s=%s\\n' 'POSTGRES_DB' \"infinity\" >> \"$tmp\"\n  printf '%s=%s\\n' 'POSTGRES_PASSWORD' \"$(openssl rand -hex 32)\" >> \"$tmp\"\n  printf '%s=%s\\n' 'APP_SECRET' \"$(openssl rand -hex 32)\" >> \"$tmp\"\n  printf '%s=%s\\n' 'TWO_FACTOR_ENCRYPTION_KEY' \"$(openssl rand -hex 32)\" >> \"$tmp\"\n  chmod 0600 \"$tmp\"\n  mv -- \"$tmp\" \"$credentials\"\n  trap - EXIT\nfi\nchmod 0600 \"$credentials\"\nset -a\n. \"$credentials\"\nset +a\nreplace_container umami\nreplace_container infinity-umami-db\ndocker run -d --restart unless-stopped --label infinity-iac-recipe=umami --name infinity-umami-db --network infinity-umami-network -v infinity-umami-database:/var/lib/postgresql/data --env-file \"$credentials\" postgres:16-alpine\nwait_for docker exec infinity-umami-db sh -ec 'PGPASSWORD=\"$POSTGRES_PASSWORD\" psql -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -Atqc \"SELECT 1\"'\ndocker run -d --restart unless-stopped --label infinity-iac-recipe=umami --name umami --network infinity-umami-network -v infinity-umami-data:/tmp/umami -e DATABASE_URL=\"postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@infinity-umami-db:5432/$POSTGRES_DB\" -e APP_SECRET=\"$APP_SECRET\" -e TWO_FACTOR_ENCRYPTION_KEY=\"$TWO_FACTOR_ENCRYPTION_KEY\" -p 127.0.0.1:{{port}}:3000 ghcr.io/umami-software/umami:latest\n",
      "timeout_seconds": 1500
    }
  ],
  "health": [
    {
      "type": "http",
      "port": 3000,
      "path": "/api/heartbeat",
      "timeout_seconds": 300
    }
  ],
  "outputs": {
    "url": {
      "type": "string",
      "value": "http://127.0.0.1:{{port}}"
    },
    "credentials_file": {
      "type": "string",
      "value": "/var/lib/infinity-iac/umami/credentials.env",
      "sensitive": true
    }
  },
  "status": "experimental",
  "requirements": [
    "Persisted PostgreSQL analytics application; change the upstream starter administrator password immediately through the SSH tunnel.",
    "Configure authorized tracked sites, privacy settings and TLS before collecting real visitor data."
  ]
}
