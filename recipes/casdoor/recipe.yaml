{
  "api_version": "recipe/v1",
  "version": "1.1.0",
  "kind": "application",
  "supports": {
    "providers": [
      "oracle"
    ],
    "os": [
      "ubuntu-24.04",
      "ubuntu-22.04"
    ],
    "architectures": []
  },
  "name": "casdoor",
  "description": "Identity and access management.",
  "inputs": {
    "port": {
      "type": "integer",
      "description": "Loopback host port reserved for a completed deployment; this integration remains blocked.",
      "default": 8000,
      "min": 1,
      "max": 65535
    }
  },
  "resources": {
    "specs": "ibase2",
    "cpu": 2,
    "ram_gb": 2,
    "storage_gb": 30,
    "ingress": [
      {
        "port": 8000,
        "protocol": "tcp",
        "source": "loopback"
      }
    ]
  },
  "steps": [
    {
      "id": "require-supported-deployment",
      "type": "command",
      "command": "printf '%s\\n' 'casdoor: deployment prerequisites are not yet implemented; inspect recipe requirements.' >&2; exit 1",
      "timeout_seconds": 10
    }
  ],
  "health": [],
  "outputs": {},
  "status": "template",
  "requirements": [
    "Persist a supported SQL database and Casdoor configuration/initialization data; configure driver, connection parameters, origin and bootstrap accounts for the chosen release.",
    "Configure valid authentication callback domains, trusted OAuth/SAML providers and TLS; the stock image alone does not define an identity deployment."
  ]
}
