{
  "api_version": "recipe/v1",
  "version": "1.1.0",
  "kind": "application",
  "supports": {
    "providers": [
      "oracle"
    ],
    "os": [
      "ubuntu-24.04",
      "ubuntu-22.04"
    ],
    "architectures": []
  },
  "name": "seafile",
  "description": "File hosting and collaboration.",
  "inputs": {
    "port": {
      "type": "integer",
      "description": "Loopback host port reserved for a completed deployment; this integration remains blocked.",
      "default": 80,
      "min": 1,
      "max": 65535
    }
  },
  "resources": {
    "specs": "ibase2",
    "cpu": 2,
    "ram_gb": 2,
    "storage_gb": 30,
    "ingress": [
      {
        "port": 80,
        "protocol": "tcp",
        "source": "loopback"
      }
    ]
  },
  "steps": [
    {
      "id": "require-supported-deployment",
      "type": "command",
      "command": "printf '%s\\n' 'seafile: deployment prerequisites are not yet implemented; inspect recipe requirements.' >&2; exit 1",
      "timeout_seconds": 10
    }
  ],
  "health": [],
  "outputs": {},
  "status": "template",
  "requirements": [
    "Use the version-supported Seafile stack with persistent database, required cache and durable data/configuration; initialize administrator and site URL.",
    "Provide TLS/proxy and background/file-service readiness, respecting release-specific object-storage/cache configuration and image architectures."
  ]
}
