{
  "api_version": "recipe/v1",
  "version": "1.1.0",
  "kind": "application",
  "supports": {
    "providers": [
      "oracle"
    ],
    "os": [
      "ubuntu-24.04",
      "ubuntu-22.04"
    ],
    "architectures": [
      "amd64",
      "arm64"
    ]
  },
  "name": "registry",
  "description": "OCI container registry.",
  "inputs": {
    "port": {
      "type": "integer",
      "description": "Loopback host port; use an SSH tunnel or an authenticated reverse proxy.",
      "default": 5000,
      "min": 1,
      "max": 65535
    }
  },
  "resources": {
    "specs": "ibase2",
    "cpu": 2,
    "ram_gb": 2,
    "storage_gb": 30,
    "ingress": [
      {
        "port": 5000,
        "protocol": "tcp",
        "source": "loopback"
      }
    ]
  },
  "steps": [
    {
      "id": "install-docker",
      "type": "package",
      "package": "docker.io"
    },
    {
      "id": "start-registry",
      "type": "command",
      "command": "if docker volume inspect infinity-registry-data >/dev/null 2>&1; then\n  owner=$(docker volume inspect -f '{{ index .Labels \"infinity-iac-recipe\" }}' infinity-registry-data)\n  [ \"$owner\" = registry ] || { echo \"Refusing unowned volume\" >&2; exit 1; }\nelse\n  docker volume create --label infinity-iac-recipe=registry infinity-registry-data >/dev/null\nfi\nif docker inspect registry >/dev/null 2>&1; then\n  owner=$(docker inspect -f '{{ index .Config.Labels \"infinity-iac-recipe\" }}' registry)\n  [ \"$owner\" = registry ] || { echo \"Refusing unowned container\" >&2; exit 1; }\n  docker rm -f registry >/dev/null\nfi\ndocker run -d --restart unless-stopped --name registry --label infinity-iac-recipe=registry -v infinity-registry-data:/var/lib/registry -p 127.0.0.1:{{port}}:5000 registry:2",
      "timeout_seconds": 900
    }
  ],
  "health": [
    {
      "type": "http",
      "port": 5000,
      "path": "/v2/",
      "timeout_seconds": 180
    }
  ],
  "outputs": {
    "url": {
      "type": "string",
      "value": "http://127.0.0.1:{{port}}"
    }
  },
  "status": "experimental"
}
