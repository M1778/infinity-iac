{
  "api_version": "recipe/v1",
  "version": "1.1.0",
  "kind": "application",
  "supports": {
    "providers": [
      "oracle"
    ],
    "os": [
      "ubuntu-24.04",
      "ubuntu-22.04"
    ],
    "architectures": [
      "amd64",
      "arm64"
    ]
  },
  "name": "ghost",
  "description": "Publishing platform.",
  "inputs": {
    "port": {
      "type": "integer",
      "description": "Loopback host port; connect through an SSH tunnel or an authenticated reverse proxy.",
      "default": 2368,
      "min": 1,
      "max": 65535
    }
  },
  "resources": {
    "specs": "auto",
    "cpu": 2,
    "ram_gb": 3,
    "storage_gb": 30,
    "ingress": [
      {
        "port": 2368,
        "protocol": "tcp",
        "source": "loopback"
      }
    ]
  },
  "steps": [
    {
      "id": "install-docker",
      "type": "package",
      "package": "docker.io"
    },
    {
      "id": "install-openssl",
      "type": "package",
      "package": "openssl"
    },
    {
      "id": "start-ghost-stack",
      "type": "command",
      "command": "recipe='ghost'\nowned_volume() {\n  if docker volume inspect \"$1\" >/dev/null 2>&1; then\n    owner=$(docker volume inspect -f '{{ index .Labels \"infinity-iac-recipe\" }}' \"$1\")\n    [ \"$owner\" = \"$recipe\" ] || { printf '%s\\n' 'Refusing unowned volume' >&2; exit 1; }\n  else\n    docker volume create --label \"infinity-iac-recipe=$recipe\" \"$1\" >/dev/null\n  fi\n}\nowned_network() {\n  if docker network inspect \"$1\" >/dev/null 2>&1; then\n    owner=$(docker network inspect -f '{{ index .Labels \"infinity-iac-recipe\" }}' \"$1\")\n    [ \"$owner\" = \"$recipe\" ] || { printf '%s\\n' 'Refusing unowned network' >&2; exit 1; }\n  else\n    docker network create --label \"infinity-iac-recipe=$recipe\" \"$1\" >/dev/null\n  fi\n}\nreplace_container() {\n  if docker inspect \"$1\" >/dev/null 2>&1; then\n    owner=$(docker inspect -f '{{ index .Config.Labels \"infinity-iac-recipe\" }}' \"$1\")\n    [ \"$owner\" = \"$recipe\" ] || { printf '%s\\n' 'Refusing unowned container' >&2; exit 1; }\n    docker rm -f \"$1\" >/dev/null\n  fi\n}\nwait_for() {\n  local deadline=$((SECONDS + 180))\n  until \"$@\" >/dev/null 2>&1; do\n    (( SECONDS < deadline )) || { printf '%s\\n' 'Dependency readiness timed out' >&2; exit 1; }\n    sleep 3\n  done\n}\nowned_network infinity-ghost-network\nowned_volume infinity-ghost-database\nowned_volume infinity-ghost-content\ninstall -d -m 0700 /var/lib/infinity-iac/ghost\ncredentials=/var/lib/infinity-iac/ghost/credentials.env\ntest ! -L \"$credentials\"\nif [ ! -e \"$credentials\" ]; then\n  umask 077\n  tmp=$(mktemp \"${credentials}.XXXXXX\")\n  trap 'rm -f -- \"$tmp\"' EXIT\n  printf '%s=%s\\n' 'MARIADB_ROOT_PASSWORD' \"$(openssl rand -hex 32)\" >> \"$tmp\"\n  printf '%s=%s\\n' 'MARIADB_USER' \"infinity\" >> \"$tmp\"\n  printf '%s=%s\\n' 'MARIADB_DATABASE' \"infinity\" >> \"$tmp\"\n  printf '%s=%s\\n' 'MARIADB_PASSWORD' \"$(openssl rand -hex 32)\" >> \"$tmp\"\n  chmod 0600 \"$tmp\"\n  mv -- \"$tmp\" \"$credentials\"\n  trap - EXIT\nfi\nchmod 0600 \"$credentials\"\nset -a\n. \"$credentials\"\nset +a\nreplace_container ghost\nreplace_container infinity-ghost-db\ndatabase_env=/var/lib/infinity-iac/ghost/database.env\numask 077\nprintf '%s=%s\\n' MYSQL_ROOT_PASSWORD \"$MARIADB_ROOT_PASSWORD\" MYSQL_USER \"$MARIADB_USER\" MYSQL_DATABASE \"$MARIADB_DATABASE\" MYSQL_PASSWORD \"$MARIADB_PASSWORD\" > \"$database_env\"\ndocker run -d --restart unless-stopped --label infinity-iac-recipe=ghost --name infinity-ghost-db --network infinity-ghost-network -v infinity-ghost-database:/var/lib/mysql --env-file \"$database_env\" mysql:8.4\nwait_for docker exec infinity-ghost-db sh -ec 'MYSQL_PWD=\"$MYSQL_ROOT_PASSWORD\" mysql -h 127.0.0.1 -uroot -Nse \"SELECT 1\"'\ndocker run -d --restart unless-stopped --label infinity-iac-recipe=ghost --name ghost --network infinity-ghost-network -v infinity-ghost-content:/var/lib/ghost/content -e database__client=\"mysql\" -e database__connection__host=\"infinity-ghost-db\" -e database__connection__user=\"$MARIADB_USER\" -e database__connection__password=\"$MARIADB_PASSWORD\" -e database__connection__database=\"$MARIADB_DATABASE\" -e url=\"http://localhost:{{port}}\" -p 127.0.0.1:{{port}}:2368 ghost@sha256:6303736accca40f3057b30b7c7230a66be2e263402f5cac7cda4466915a5b9bd\n",
      "timeout_seconds": 1500
    }
  ],
  "health": [
    {
      "type": "http",
      "port": 2368,
      "path": "/ghost/",
      "timeout_seconds": 300
    }
  ],
  "outputs": {
    "url": {
      "type": "string",
      "value": "http://127.0.0.1:{{port}}"
    },
    "credentials_file": {
      "type": "string",
      "value": "/var/lib/infinity-iac/ghost/credentials.env",
      "sensitive": true
    }
  },
  "status": "experimental",
  "requirements": [
    "Complete initial administrator setup through localhost SSH forwarding; isolated MySQL 8.4, Ghost content and credentials persist. Configure email, the public URL and HTTPS before publication."
  ]
}
