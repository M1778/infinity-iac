{
  "api_version": "recipe/v1",
  "version": "1.1.0",
  "kind": "application",
  "supports": {
    "providers": [
      "oracle"
    ],
    "os": [
      "ubuntu-24.04",
      "ubuntu-22.04"
    ],
    "architectures": [
      "amd64",
      "arm64"
    ]
  },
  "name": "couchdb",
  "description": "Document database.",
  "inputs": {
    "port": {
      "type": "integer",
      "description": "Loopback host port; connect through an SSH tunnel or an authenticated reverse proxy.",
      "default": 5984,
      "min": 1,
      "max": 65535
    }
  },
  "resources": {
    "specs": "auto",
    "cpu": 2,
    "ram_gb": 2,
    "storage_gb": 30,
    "ingress": [
      {
        "port": 5984,
        "protocol": "tcp",
        "source": "loopback"
      }
    ]
  },
  "steps": [
    {
      "id": "install-docker",
      "type": "package",
      "package": "docker.io"
    },
    {
      "id": "install-curl",
      "type": "package",
      "package": "curl"
    },
    {
      "id": "install-openssl",
      "type": "package",
      "package": "openssl"
    },
    {
      "id": "start-couchdb",
      "type": "command",
      "command": "recipe='couchdb'\nowned_volume() {\n  if docker volume inspect \"$1\" >/dev/null 2>&1; then\n    owner=$(docker volume inspect -f '{{ index .Labels \"infinity-iac-recipe\" }}' \"$1\")\n    [ \"$owner\" = \"$recipe\" ] || { printf '%s\\n' 'Refusing unowned volume' >&2; exit 1; }\n  else\n    docker volume create --label \"infinity-iac-recipe=$recipe\" \"$1\" >/dev/null\n  fi\n}\nreplace_container() {\n  if docker inspect \"$1\" >/dev/null 2>&1; then\n    owner=$(docker inspect -f '{{ index .Config.Labels \"infinity-iac-recipe\" }}' \"$1\")\n    [ \"$owner\" = \"$recipe\" ] || { printf '%s\\n' 'Refusing unowned container' >&2; exit 1; }\n    docker rm -f \"$1\" >/dev/null\n  fi\n}\nowned_volume 'infinity-couchdb-data'\ninstall -d -m 0700 /var/lib/infinity-iac/couchdb\ncredentials=/var/lib/infinity-iac/couchdb/credentials.env\ntest ! -L \"$credentials\"\nif [ ! -e \"$credentials\" ]; then\n  umask 077\n  tmp=$(mktemp \"${credentials}.XXXXXX\")\n  trap 'rm -f -- \"$tmp\"' EXIT\n  printf '%s=%s\\n' 'COUCHDB_USER' \"infinity\" >> \"$tmp\"\n  printf '%s=%s\\n' 'COUCHDB_PASSWORD' \"$(openssl rand -hex 32)\" >> \"$tmp\"\n  chmod 0600 \"$tmp\"\n  mv -- \"$tmp\" \"$credentials\"\n  trap - EXIT\nfi\nchmod 0600 \"$credentials\"\ninstall -d -m 0755 /var/lib/infinity-iac/couchdb\nprintf '%s\\n' '[couchdb]' 'single_node = true' > /var/lib/infinity-iac/couchdb/10-single-node.ini\nreplace_container couchdb\ndocker run -d --restart unless-stopped --label infinity-iac-recipe=couchdb --name couchdb -v infinity-couchdb-data:/opt/couchdb/data --env-file \"$credentials\" -v /var/lib/infinity-iac/couchdb/10-single-node.ini:/opt/couchdb/etc/local.d/10-single-node.ini:ro -p 127.0.0.1:{{port}}:5984 couchdb@sha256:907eab5b7e55ab7cfd241d39b90b2a335ea40bef82acee5a37388c08bf201dda\n",
      "timeout_seconds": 1200
    }
  ],
  "health": [
    {
      "type": "command",
      "command": "set -a; . /var/lib/infinity-iac/couchdb/credentials.env; set +a; curl --fail --silent --show-error --user \"$COUCHDB_USER:$COUCHDB_PASSWORD\" http://127.0.0.1:{{port}}/_up >/dev/null",
      "timeout_seconds": 240
    }
  ],
  "outputs": {
    "url": {
      "type": "string",
      "value": "http://127.0.0.1:{{port}}"
    },
    "credentials_file": {
      "type": "string",
      "value": "/var/lib/infinity-iac/couchdb/credentials.env",
      "sensitive": true
    }
  },
  "status": "experimental",
  "requirements": [
    "Authenticated single-node CouchDB; bootstrap credentials are stored on the instance with mode 0600."
  ]
}
