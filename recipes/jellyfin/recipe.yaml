{
  "api_version": "recipe/v1",
  "version": "1.1.0",
  "kind": "application",
  "supports": {
    "providers": [
      "oracle"
    ],
    "os": [
      "ubuntu-24.04",
      "ubuntu-22.04"
    ],
    "architectures": [
      "amd64",
      "arm64"
    ]
  },
  "name": "jellyfin",
  "description": "Free media system.",
  "inputs": {
    "port": {
      "type": "integer",
      "description": "Loopback host port; use an SSH tunnel or an authenticated reverse proxy.",
      "default": 8096,
      "min": 1,
      "max": 65535
    }
  },
  "resources": {
    "specs": "ibase2",
    "cpu": 2,
    "ram_gb": 2,
    "storage_gb": 30,
    "ingress": [
      {
        "port": 8096,
        "protocol": "tcp",
        "source": "loopback"
      }
    ]
  },
  "steps": [
    {
      "id": "install-docker",
      "type": "package",
      "package": "docker.io"
    },
    {
      "id": "start-jellyfin",
      "type": "command",
      "command": "if docker volume inspect infinity-jellyfin-config >/dev/null 2>&1; then\n  owner=$(docker volume inspect -f '{{ index .Labels \"infinity-iac-recipe\" }}' infinity-jellyfin-config)\n  [ \"$owner\" = jellyfin ] || { echo \"Refusing unowned volume\" >&2; exit 1; }\nelse\n  docker volume create --label infinity-iac-recipe=jellyfin infinity-jellyfin-config >/dev/null\nfi\nif docker volume inspect infinity-jellyfin-cache >/dev/null 2>&1; then\n  owner=$(docker volume inspect -f '{{ index .Labels \"infinity-iac-recipe\" }}' infinity-jellyfin-cache)\n  [ \"$owner\" = jellyfin ] || { echo \"Refusing unowned volume\" >&2; exit 1; }\nelse\n  docker volume create --label infinity-iac-recipe=jellyfin infinity-jellyfin-cache >/dev/null\nfi\nif docker inspect jellyfin >/dev/null 2>&1; then\n  owner=$(docker inspect -f '{{ index .Config.Labels \"infinity-iac-recipe\" }}' jellyfin)\n  [ \"$owner\" = jellyfin ] || { echo \"Refusing unowned container\" >&2; exit 1; }\n  docker rm -f jellyfin >/dev/null\nfi\ndocker run -d --restart unless-stopped --name jellyfin --label infinity-iac-recipe=jellyfin -v infinity-jellyfin-config:/config -v infinity-jellyfin-cache:/cache -p 127.0.0.1:{{port}}:8096 jellyfin/jellyfin:latest",
      "timeout_seconds": 900
    }
  ],
  "health": [
    {
      "type": "http",
      "port": 8096,
      "path": "/health",
      "timeout_seconds": 180
    }
  ],
  "outputs": {
    "url": {
      "type": "string",
      "value": "http://127.0.0.1:{{port}}"
    }
  },
  "status": "experimental"
}
