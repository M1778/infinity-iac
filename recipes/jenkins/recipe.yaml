{
  "api_version": "recipe/v1",
  "version": "1.1.0",
  "kind": "application",
  "supports": {
    "providers": [
      "oracle"
    ],
    "os": [
      "ubuntu-24.04",
      "ubuntu-22.04"
    ],
    "architectures": [
      "amd64",
      "arm64"
    ]
  },
  "name": "jenkins",
  "description": "Automation server.",
  "inputs": {
    "port": {
      "type": "integer",
      "description": "Loopback host port; connect through an SSH tunnel or an authenticated reverse proxy.",
      "default": 8080,
      "min": 1,
      "max": 65535
    }
  },
  "resources": {
    "specs": "auto",
    "cpu": 2,
    "ram_gb": 3,
    "storage_gb": 30,
    "ingress": [
      {
        "port": 8080,
        "protocol": "tcp",
        "source": "loopback"
      }
    ]
  },
  "steps": [
    {
      "id": "install-docker",
      "type": "package",
      "package": "docker.io"
    },
    {
      "id": "start-jenkins",
      "type": "command",
      "command": "recipe='jenkins'\nowned_volume() {\n  if docker volume inspect \"$1\" >/dev/null 2>&1; then\n    owner=$(docker volume inspect -f '{{ index .Labels \"infinity-iac-recipe\" }}' \"$1\")\n    [ \"$owner\" = \"$recipe\" ] || { printf '%s\\n' 'Refusing unowned volume' >&2; exit 1; }\n  else\n    docker volume create --label \"infinity-iac-recipe=$recipe\" \"$1\" >/dev/null\n  fi\n}\nreplace_container() {\n  if docker inspect \"$1\" >/dev/null 2>&1; then\n    owner=$(docker inspect -f '{{ index .Config.Labels \"infinity-iac-recipe\" }}' \"$1\")\n    [ \"$owner\" = \"$recipe\" ] || { printf '%s\\n' 'Refusing unowned container' >&2; exit 1; }\n    docker rm -f \"$1\" >/dev/null\n  fi\n}\nowned_volume 'infinity-jenkins-home'\nreplace_container jenkins\ndocker run -d --restart unless-stopped --label infinity-iac-recipe=jenkins --name jenkins -v infinity-jenkins-home:/var/jenkins_home -p 127.0.0.1:{{port}}:8080 jenkins/jenkins@sha256:74401de6a6f92e1afe1b02d1c8e3d0c33f263bfb5275dd8813f9150355f2367b\n",
      "timeout_seconds": 1200
    }
  ],
  "health": [
    {
      "type": "http",
      "port": 8080,
      "path": "/login",
      "timeout_seconds": 240
    }
  ],
  "outputs": {
    "url": {
      "type": "string",
      "value": "http://127.0.0.1:{{port}}"
    }
  },
  "status": "experimental",
  "requirements": [
    "Unlock Jenkins using the owner-only initialAdminPassword in /var/jenkins_home/secrets inside the owned container.",
    "No host Docker socket or agent port is exposed; install trusted plugins and configure agents separately."
  ]
}
