{
  "api_version": "recipe/v1",
  "version": "1.1.0",
  "kind": "application",
  "supports": {
    "providers": [
      "oracle"
    ],
    "os": [
      "ubuntu-24.04",
      "ubuntu-22.04"
    ],
    "architectures": [
      "amd64",
      "arm64"
    ]
  },
  "name": "kafka",
  "description": "Event streaming platform.",
  "inputs": {
    "port": {
      "type": "integer",
      "description": "Loopback host port; connect through an SSH tunnel or an authenticated reverse proxy.",
      "default": 9092,
      "min": 1,
      "max": 65535
    }
  },
  "resources": {
    "specs": "auto",
    "cpu": 2,
    "ram_gb": 3,
    "storage_gb": 30,
    "ingress": [
      {
        "port": 9092,
        "protocol": "tcp",
        "source": "loopback"
      }
    ]
  },
  "steps": [
    {
      "id": "install-docker",
      "type": "package",
      "package": "docker.io"
    },
    {
      "id": "start-kafka",
      "type": "command",
      "command": "recipe='kafka'\nowned_volume() {\n  if docker volume inspect \"$1\" >/dev/null 2>&1; then\n    owner=$(docker volume inspect -f '{{ index .Labels \"infinity-iac-recipe\" }}' \"$1\")\n    [ \"$owner\" = \"$recipe\" ] || { printf '%s\\n' 'Refusing unowned volume' >&2; exit 1; }\n  else\n    docker volume create --label \"infinity-iac-recipe=$recipe\" \"$1\" >/dev/null\n  fi\n}\nreplace_container() {\n  if docker inspect \"$1\" >/dev/null 2>&1; then\n    owner=$(docker inspect -f '{{ index .Config.Labels \"infinity-iac-recipe\" }}' \"$1\")\n    [ \"$owner\" = \"$recipe\" ] || { printf '%s\\n' 'Refusing unowned container' >&2; exit 1; }\n    docker rm -f \"$1\" >/dev/null\n  fi\n}\nowned_volume 'infinity-kafka-data'\nreplace_container kafka\ndocker run -d --restart unless-stopped --label infinity-iac-recipe=kafka --name kafka -v infinity-kafka-data:/var/lib/kafka/data -e KAFKA_NODE_ID=\"1\" -e KAFKA_PROCESS_ROLES=\"broker,controller\" -e KAFKA_CONTROLLER_LISTENER_NAMES=\"CONTROLLER\" -e KAFKA_LISTENERS=\"PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093\" -e KAFKA_ADVERTISED_LISTENERS=\"PLAINTEXT://localhost:{{port}},INTERNAL://localhost:29092\" -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=\"CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT\" -e KAFKA_INTER_BROKER_LISTENER_NAME=\"INTERNAL\" -e KAFKA_CONTROLLER_QUORUM_VOTERS=\"1@localhost:9093\" -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=\"1\" -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=\"1\" -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=\"1\" -e KAFKA_LOG_DIRS=\"/var/lib/kafka/data\" -e CLUSTER_ID=\"MkU3OEVBNTcwNTJENDM2Qk\" -p 127.0.0.1:{{port}}:9092 apache/kafka:4.1.1\n",
      "timeout_seconds": 1200
    }
  ],
  "health": [
    {
      "type": "command",
      "command": "docker exec kafka /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null",
      "timeout_seconds": 240
    }
  ],
  "outputs": {
    "url": {
      "type": "string",
      "value": "http://127.0.0.1:{{port}}"
    }
  },
  "status": "experimental",
  "requirements": [
    "Single-node KRaft plaintext evaluation, loopback-only; clients use localhost SSH forwarding matching the selected host port.",
    "Configure TLS/SASL, replication and recovery before production; internal broker/controller listeners are not mapped."
  ]
}
