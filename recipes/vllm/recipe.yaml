{
  "api_version": "recipe/v1",
  "version": "1.1.0",
  "kind": "application",
  "supports": {
    "providers": [
      "oracle"
    ],
    "os": [
      "ubuntu-24.04",
      "ubuntu-22.04"
    ],
    "architectures": []
  },
  "name": "vllm",
  "description": "High-throughput LLM serving.",
  "inputs": {
    "port": {
      "type": "integer",
      "description": "Loopback host port reserved for a completed deployment; this integration remains blocked.",
      "default": 8000,
      "min": 1,
      "max": 65535
    }
  },
  "resources": {
    "specs": "ibase2",
    "cpu": 2,
    "ram_gb": 2,
    "storage_gb": 30,
    "ingress": [
      {
        "port": 8000,
        "protocol": "tcp",
        "source": "loopback"
      }
    ]
  },
  "steps": [
    {
      "id": "require-supported-deployment",
      "type": "command",
      "command": "printf '%s\\n' 'vllm: deployment prerequisites are not yet implemented; inspect recipe requirements.' >&2; exit 1",
      "timeout_seconds": 10
    }
  ],
  "health": [],
  "outputs": {},
  "status": "template",
  "requirements": [
    "Provide a supported GPU VM, compatible drivers/NVIDIA container runtime, sufficient VRAM/RAM/storage and a version/platform-matched vLLM image.",
    "Choose an authorized model/token, supply API authentication and loopback listener settings, then verify an actual inference response; default 2-GB CPU VMs cannot run this workload."
  ]
}
