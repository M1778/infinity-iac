{
  "api_version": "recipe/v1",
  "name": "n8n",
  "version": "1.1.0",
  "kind": "application",
  "description": "Self-hosted n8n workflow automation service.",
  "supports": {
    "providers": [
      "oracle"
    ],
    "os": [
      "ubuntu-latest",
      "ubuntu-24.04",
      "ubuntu-22.04"
    ],
    "architectures": [
      "amd64",
      "arm64"
    ]
  },
  "inputs": {
    "port": {
      "type": "integer",
      "description": "Loopback host port; use an SSH tunnel or an authenticated reverse proxy.",
      "default": 5678,
      "min": 1,
      "max": 65535
    }
  },
  "resources": {
    "specs": "ibase2",
    "cpu": 2,
    "ram_gb": 2,
    "storage_gb": 35,
    "ingress": [
      {
        "port": 5678,
        "protocol": "tcp",
        "source": "loopback"
      }
    ]
  },
  "steps": [
    {
      "id": "install-docker",
      "type": "package",
      "package": "docker.io"
    },
    {
      "id": "start-n8n",
      "type": "command",
      "command": "if docker volume inspect infinity-n8n-data >/dev/null 2>&1; then\n  owner=$(docker volume inspect -f '{{ index .Labels \"infinity-iac-recipe\" }}' infinity-n8n-data)\n  [ \"$owner\" = n8n ] || { echo \"Refusing unowned volume\" >&2; exit 1; }\nelse\n  docker volume create --label infinity-iac-recipe=n8n infinity-n8n-data >/dev/null\nfi\nif docker inspect n8n >/dev/null 2>&1; then\n  owner=$(docker inspect -f '{{ index .Config.Labels \"infinity-iac-recipe\" }}' n8n)\n  [ \"$owner\" = n8n ] || { echo \"Refusing unowned container\" >&2; exit 1; }\n  docker rm -f n8n >/dev/null\nfi\ndocker run -d --restart unless-stopped -v infinity-n8n-data:/home/node/.n8n --label infinity-iac-recipe=n8n -p 127.0.0.1:{{port}}:5678 -e N8N_SECURE_COOKIE=false -e N8N_DIAGNOSTICS_ENABLED=false --name n8n docker.n8n.io/n8nio/n8n:latest",
      "timeout_seconds": 900
    }
  ],
  "health": [
    {
      "type": "http",
      "port": 5678,
      "path": "/healthz",
      "timeout_seconds": 120
    }
  ],
  "outputs": {
    "url": {
      "type": "string",
      "value": "http://127.0.0.1:{{port}}"
    }
  },
  "status": "experimental"
}
