{
  "api_version": "recipe/v1",
  "version": "1.1.0",
  "kind": "application",
  "supports": {
    "providers": [
      "oracle"
    ],
    "os": [
      "ubuntu-24.04",
      "ubuntu-22.04"
    ],
    "architectures": [
      "amd64",
      "arm64"
    ]
  },
  "name": "clickhouse",
  "description": "Analytical columnar database.",
  "inputs": {
    "port": {
      "type": "integer",
      "description": "Loopback host port; connect through an SSH tunnel or an authenticated reverse proxy.",
      "default": 8123,
      "min": 1,
      "max": 65535
    }
  },
  "resources": {
    "specs": "auto",
    "cpu": 2,
    "ram_gb": 3,
    "storage_gb": 30,
    "ingress": [
      {
        "port": 8123,
        "protocol": "tcp",
        "source": "loopback"
      }
    ]
  },
  "steps": [
    {
      "id": "install-docker",
      "type": "package",
      "package": "docker.io"
    },
    {
      "id": "install-curl",
      "type": "package",
      "package": "curl"
    },
    {
      "id": "install-openssl",
      "type": "package",
      "package": "openssl"
    },
    {
      "id": "start-clickhouse",
      "type": "command",
      "command": "recipe='clickhouse'\nowned_volume() {\n  if docker volume inspect \"$1\" >/dev/null 2>&1; then\n    owner=$(docker volume inspect -f '{{ index .Labels \"infinity-iac-recipe\" }}' \"$1\")\n    [ \"$owner\" = \"$recipe\" ] || { printf '%s\\n' 'Refusing unowned volume' >&2; exit 1; }\n  else\n    docker volume create --label \"infinity-iac-recipe=$recipe\" \"$1\" >/dev/null\n  fi\n}\nreplace_container() {\n  if docker inspect \"$1\" >/dev/null 2>&1; then\n    owner=$(docker inspect -f '{{ index .Config.Labels \"infinity-iac-recipe\" }}' \"$1\")\n    [ \"$owner\" = \"$recipe\" ] || { printf '%s\\n' 'Refusing unowned container' >&2; exit 1; }\n    docker rm -f \"$1\" >/dev/null\n  fi\n}\nowned_volume 'infinity-clickhouse-data'\nowned_volume 'infinity-clickhouse-logs'\ninstall -d -m 0700 /var/lib/infinity-iac/clickhouse\ncredentials=/var/lib/infinity-iac/clickhouse/credentials.env\ntest ! -L \"$credentials\"\nif [ ! -e \"$credentials\" ]; then\n  umask 077\n  tmp=$(mktemp \"${credentials}.XXXXXX\")\n  trap 'rm -f -- \"$tmp\"' EXIT\n  printf '%s=%s\\n' 'CLICKHOUSE_USER' \"infinity\" >> \"$tmp\"\n  printf '%s=%s\\n' 'CLICKHOUSE_PASSWORD' \"$(openssl rand -hex 32)\" >> \"$tmp\"\n  printf '%s=%s\\n' 'CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT' \"1\" >> \"$tmp\"\n  chmod 0600 \"$tmp\"\n  mv -- \"$tmp\" \"$credentials\"\n  trap - EXIT\nfi\nchmod 0600 \"$credentials\"\nreplace_container clickhouse\ndocker run -d --restart unless-stopped --label infinity-iac-recipe=clickhouse --name clickhouse -v infinity-clickhouse-data:/var/lib/clickhouse -v infinity-clickhouse-logs:/var/log/clickhouse-server --env-file \"$credentials\" -p 127.0.0.1:{{port}}:8123 clickhouse/clickhouse-server@sha256:739e099abd1157390960a59e4532d21781d8fde57e6e4151cb920ea02c30b1ce\n",
      "timeout_seconds": 1200
    }
  ],
  "health": [
    {
      "type": "command",
      "command": "set -a; . /var/lib/infinity-iac/clickhouse/credentials.env; set +a; curl --fail --silent --show-error --user \"$CLICKHOUSE_USER:$CLICKHOUSE_PASSWORD\" --data-binary \"SELECT 1\" http://127.0.0.1:{{port}}/ | grep -qx 1",
      "timeout_seconds": 240
    }
  ],
  "outputs": {
    "url": {
      "type": "string",
      "value": "http://127.0.0.1:{{port}}"
    },
    "credentials_file": {
      "type": "string",
      "value": "/var/lib/infinity-iac/clickhouse/credentials.env",
      "sensitive": true
    }
  },
  "status": "experimental",
  "requirements": [
    "Authenticated single-node HTTP SQL endpoint; native port 9000 is not mapped. Credentials remain in a mode-0600 file on the instance."
  ]
}
