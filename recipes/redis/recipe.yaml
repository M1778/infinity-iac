{
  "api_version": "recipe/v1",
  "version": "1.1.0",
  "kind": "application",
  "supports": {
    "providers": [
      "oracle"
    ],
    "os": [
      "ubuntu-24.04",
      "ubuntu-22.04"
    ],
    "architectures": [
      "amd64",
      "arm64"
    ]
  },
  "name": "redis",
  "description": "In-memory data store.",
  "inputs": {
    "port": {
      "type": "integer",
      "description": "Loopback host port; use an SSH tunnel or an authenticated reverse proxy.",
      "default": 6379,
      "min": 1,
      "max": 65535
    }
  },
  "resources": {
    "specs": "ibase2",
    "cpu": 2,
    "ram_gb": 2,
    "storage_gb": 30,
    "ingress": [
      {
        "port": 6379,
        "protocol": "tcp",
        "source": "loopback"
      }
    ]
  },
  "steps": [
    {
      "id": "install-docker",
      "type": "package",
      "package": "docker.io"
    },
    {
      "id": "start-redis",
      "type": "command",
      "command": "if docker volume inspect infinity-redis-data >/dev/null 2>&1; then\n  owner=$(docker volume inspect -f '{{ index .Labels \"infinity-iac-recipe\" }}' infinity-redis-data)\n  [ \"$owner\" = redis ] || { echo \"Refusing unowned volume\" >&2; exit 1; }\nelse\n  docker volume create --label infinity-iac-recipe=redis infinity-redis-data >/dev/null\nfi\nif docker inspect redis >/dev/null 2>&1; then\n  owner=$(docker inspect -f '{{ index .Config.Labels \"infinity-iac-recipe\" }}' redis)\n  [ \"$owner\" = redis ] || { echo \"Refusing unowned container\" >&2; exit 1; }\n  docker rm -f redis >/dev/null\nfi\ndocker run -d --restart unless-stopped --name redis --label infinity-iac-recipe=redis -v infinity-redis-data:/data -p 127.0.0.1:{{port}}:6379 redis:7-alpine redis-server --appendonly yes",
      "timeout_seconds": 900
    }
  ],
  "health": [
    {
      "type": "command",
      "command": "docker exec redis redis-cli ping | grep -qx PONG",
      "timeout_seconds": 180
    }
  ],
  "outputs": {},
  "status": "experimental"
}
