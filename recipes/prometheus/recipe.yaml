{
  "api_version": "recipe/v1",
  "version": "1.1.0",
  "kind": "application",
  "supports": {
    "providers": [
      "oracle"
    ],
    "os": [
      "ubuntu-24.04",
      "ubuntu-22.04"
    ],
    "architectures": [
      "amd64",
      "arm64"
    ]
  },
  "name": "prometheus",
  "description": "Metrics collection and alerting.",
  "inputs": {
    "port": {
      "type": "integer",
      "description": "Loopback host port; use an SSH tunnel or an authenticated reverse proxy.",
      "default": 9090,
      "min": 1,
      "max": 65535
    }
  },
  "resources": {
    "specs": "ibase2",
    "cpu": 2,
    "ram_gb": 2,
    "storage_gb": 30,
    "ingress": [
      {
        "port": 9090,
        "protocol": "tcp",
        "source": "loopback"
      }
    ]
  },
  "steps": [
    {
      "id": "install-docker",
      "type": "package",
      "package": "docker.io"
    },
    {
      "id": "start-prometheus",
      "type": "command",
      "command": "if docker volume inspect infinity-prometheus-data >/dev/null 2>&1; then\n  owner=$(docker volume inspect -f '{{ index .Labels \"infinity-iac-recipe\" }}' infinity-prometheus-data)\n  [ \"$owner\" = prometheus ] || { echo \"Refusing unowned volume\" >&2; exit 1; }\nelse\n  docker volume create --label infinity-iac-recipe=prometheus infinity-prometheus-data >/dev/null\nfi\nif docker inspect prometheus >/dev/null 2>&1; then\n  owner=$(docker inspect -f '{{ index .Config.Labels \"infinity-iac-recipe\" }}' prometheus)\n  [ \"$owner\" = prometheus ] || { echo \"Refusing unowned container\" >&2; exit 1; }\n  docker rm -f prometheus >/dev/null\nfi\ndocker run -d --restart unless-stopped --name prometheus --label infinity-iac-recipe=prometheus -v infinity-prometheus-data:/prometheus -p 127.0.0.1:{{port}}:9090 prom/prometheus:latest",
      "timeout_seconds": 900
    }
  ],
  "health": [
    {
      "type": "http",
      "port": 9090,
      "path": "/-/ready",
      "timeout_seconds": 180
    }
  ],
  "outputs": {
    "url": {
      "type": "string",
      "value": "http://127.0.0.1:{{port}}"
    }
  },
  "status": "experimental"
}
