{
  "api_version": "recipe/v1",
  "version": "1.1.0",
  "kind": "application",
  "supports": {
    "providers": [
      "oracle"
    ],
    "os": [
      "ubuntu-24.04",
      "ubuntu-22.04"
    ],
    "architectures": [
      "amd64",
      "arm64"
    ]
  },
  "name": "cockroachdb",
  "description": "Distributed SQL database.",
  "inputs": {
    "port": {
      "type": "integer",
      "description": "Loopback host port; connect through an SSH tunnel or an authenticated reverse proxy.",
      "default": 8080,
      "min": 1,
      "max": 65535
    }
  },
  "resources": {
    "specs": "auto",
    "cpu": 2,
    "ram_gb": 3,
    "storage_gb": 30,
    "ingress": [
      {
        "port": 8080,
        "protocol": "tcp",
        "source": "loopback"
      }
    ]
  },
  "steps": [
    {
      "id": "install-docker",
      "type": "package",
      "package": "docker.io"
    },
    {
      "id": "start-cockroachdb",
      "type": "command",
      "command": "recipe='cockroachdb'\nowned_volume() {\n  if docker volume inspect \"$1\" >/dev/null 2>&1; then\n    owner=$(docker volume inspect -f '{{ index .Labels \"infinity-iac-recipe\" }}' \"$1\")\n    [ \"$owner\" = \"$recipe\" ] || { printf '%s\\n' 'Refusing unowned volume' >&2; exit 1; }\n  else\n    docker volume create --label \"infinity-iac-recipe=$recipe\" \"$1\" >/dev/null\n  fi\n}\nreplace_container() {\n  if docker inspect \"$1\" >/dev/null 2>&1; then\n    owner=$(docker inspect -f '{{ index .Config.Labels \"infinity-iac-recipe\" }}' \"$1\")\n    [ \"$owner\" = \"$recipe\" ] || { printf '%s\\n' 'Refusing unowned container' >&2; exit 1; }\n    docker rm -f \"$1\" >/dev/null\n  fi\n}\nowned_volume 'infinity-cockroachdb-data'\nreplace_container cockroachdb\ndocker run -d --restart unless-stopped --label infinity-iac-recipe=cockroachdb --name cockroachdb -v infinity-cockroachdb-data:/cockroach/cockroach-data -p 127.0.0.1:{{port}}:8080 cockroachdb/cockroach@sha256:46077f1fdacf2ae8f327994564911484dbb7dfdeea96fd838ec3df0f77418798 start-single-node --insecure --listen-addr=127.0.0.1:26257 --http-addr=0.0.0.0:8080\n",
      "timeout_seconds": 1200
    }
  ],
  "health": [
    {
      "type": "http",
      "port": 8080,
      "path": "/health?ready=1",
      "timeout_seconds": 240
    }
  ],
  "outputs": {
    "url": {
      "type": "string",
      "value": "http://127.0.0.1:{{port}}"
    }
  },
  "status": "experimental",
  "requirements": [
    "Explicitly insecure single-node UI evaluation: SQL is container-local and not mapped. This is not a secure production database cluster."
  ]
}
