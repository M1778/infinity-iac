{
  "api_version": "recipe/v1",
  "version": "1.1.0",
  "kind": "application",
  "supports": {
    "providers": [
      "oracle"
    ],
    "os": [
      "ubuntu-24.04",
      "ubuntu-22.04"
    ],
    "architectures": []
  },
  "name": "airflow",
  "description": "Workflow orchestration platform.",
  "inputs": {
    "port": {
      "type": "integer",
      "description": "Loopback host port reserved for a completed deployment; this integration remains blocked.",
      "default": 8080,
      "min": 1,
      "max": 65535
    }
  },
  "resources": {
    "specs": "ibase2",
    "cpu": 2,
    "ram_gb": 2,
    "storage_gb": 30,
    "ingress": [
      {
        "port": 8080,
        "protocol": "tcp",
        "source": "loopback"
      }
    ]
  },
  "steps": [
    {
      "id": "require-supported-deployment",
      "type": "command",
      "command": "printf '%s\\n' 'airflow: deployment prerequisites are not yet implemented; inspect recipe requirements.' >&2; exit 1",
      "timeout_seconds": 10
    }
  ],
  "health": [],
  "outputs": {},
  "status": "template",
  "requirements": [
    "Use a supported Apache Airflow version with initialized persistent PostgreSQL metadata, scheduler, triggerer, web/API server and the chosen executor/worker services.",
    "Provision Fernet/API signing keys and a real administrator, run matching database migrations, and check scheduler/executor health before accepting jobs."
  ]
}
