{
  "api_version": "recipe/v1",
  "name": "cloud-init-report",
  "version": "1.0.0",
  "kind": "script",
  "status": "experimental",
  "description": "Inspect current cloud-init status and recent bootstrap errors without rerunning initialization.",
  "supports": {
    "providers": [
      "oracle"
    ],
    "os": [
      "ubuntu-24.04",
      "ubuntu-22.04"
    ],
    "architectures": [
      "amd64",
      "arm64"
    ]
  },
  "resources": {
    "cpu": 1,
    "ram_gb": 1,
    "storage_gb": 30
  },
  "steps": [
    {
      "id": "report",
      "type": "command",
      "command": "cloud-init status --long\njournalctl -u cloud-final --no-pager -n 60",
      "timeout_seconds": 60
    }
  ]
}
