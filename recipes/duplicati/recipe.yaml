{
  "api_version": "recipe/v1",
  "version": "1.1.0",
  "kind": "application",
  "supports": {
    "providers": [
      "oracle"
    ],
    "os": [
      "ubuntu-24.04",
      "ubuntu-22.04"
    ],
    "architectures": [
      "amd64",
      "arm64"
    ]
  },
  "name": "duplicati",
  "description": "Encrypted backup manager.",
  "inputs": {
    "port": {
      "type": "integer",
      "description": "Loopback host port; connect through an SSH tunnel or an authenticated reverse proxy.",
      "default": 8200,
      "min": 1,
      "max": 65535
    }
  },
  "resources": {
    "specs": "auto",
    "cpu": 2,
    "ram_gb": 2,
    "storage_gb": 30,
    "ingress": [
      {
        "port": 8200,
        "protocol": "tcp",
        "source": "loopback"
      }
    ]
  },
  "steps": [
    {
      "id": "install-docker",
      "type": "package",
      "package": "docker.io"
    },
    {
      "id": "install-openssl",
      "type": "package",
      "package": "openssl"
    },
    {
      "id": "start-duplicati",
      "type": "command",
      "command": "recipe='duplicati'\nowned_volume() {\n  if docker volume inspect \"$1\" >/dev/null 2>&1; then\n    owner=$(docker volume inspect -f '{{ index .Labels \"infinity-iac-recipe\" }}' \"$1\")\n    [ \"$owner\" = \"$recipe\" ] || { printf '%s\\n' 'Refusing unowned volume' >&2; exit 1; }\n  else\n    docker volume create --label \"infinity-iac-recipe=$recipe\" \"$1\" >/dev/null\n  fi\n}\nreplace_container() {\n  if docker inspect \"$1\" >/dev/null 2>&1; then\n    owner=$(docker inspect -f '{{ index .Config.Labels \"infinity-iac-recipe\" }}' \"$1\")\n    [ \"$owner\" = \"$recipe\" ] || { printf '%s\\n' 'Refusing unowned container' >&2; exit 1; }\n    docker rm -f \"$1\" >/dev/null\n  fi\n}\nowned_volume 'infinity-duplicati-config'\nowned_volume 'infinity-duplicati-backups'\nowned_volume 'infinity-duplicati-source'\ninstall -d -m 0700 /var/lib/infinity-iac/duplicati\ncredentials=/var/lib/infinity-iac/duplicati/credentials.env\ntest ! -L \"$credentials\"\nif [ ! -e \"$credentials\" ]; then\n  umask 077\n  tmp=$(mktemp \"${credentials}.XXXXXX\")\n  trap 'rm -f -- \"$tmp\"' EXIT\n  printf '%s=%s\\n' 'SETTINGS_ENCRYPTION_KEY' \"$(openssl rand -hex 32)\" >> \"$tmp\"\n  printf '%s=%s\\n' 'DUPLICATI__WEBSERVICE_PASSWORD' \"$(openssl rand -hex 32)\" >> \"$tmp\"\n  chmod 0600 \"$tmp\"\n  mv -- \"$tmp\" \"$credentials\"\n  trap - EXIT\nfi\nchmod 0600 \"$credentials\"\nreplace_container duplicati\ndocker run -d --restart unless-stopped --label infinity-iac-recipe=duplicati --name duplicati -v infinity-duplicati-config:/config -v infinity-duplicati-backups:/backups -v infinity-duplicati-source:/source -e PUID=\"1000\" -e PGID=\"1000\" -e TZ=\"Etc/UTC\" --env-file \"$credentials\" -p 127.0.0.1:{{port}}:8200 lscr.io/linuxserver/duplicati:latest\n",
      "timeout_seconds": 1200
    }
  ],
  "health": [
    {
      "type": "http",
      "port": 8200,
      "path": "/",
      "timeout_seconds": 240
    }
  ],
  "outputs": {
    "url": {
      "type": "string",
      "value": "http://127.0.0.1:{{port}}"
    },
    "credentials_file": {
      "type": "string",
      "value": "/var/lib/infinity-iac/duplicati/credentials.env",
      "sensitive": true
    }
  },
  "status": "experimental",
  "requirements": [
    "UI password and settings encryption key are generated into the private credentials.env; configure authorized backup sources and an independent destination.",
    "No host paths are mounted; the owned source and backup volumes start empty. VM deletion destroys both."
  ]
}
