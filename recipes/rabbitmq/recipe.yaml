{
  "api_version": "recipe/v1",
  "version": "1.1.0",
  "kind": "application",
  "supports": {
    "providers": [
      "oracle"
    ],
    "os": [
      "ubuntu-24.04",
      "ubuntu-22.04"
    ],
    "architectures": [
      "amd64",
      "arm64"
    ]
  },
  "name": "rabbitmq",
  "description": "Message broker with management UI.",
  "inputs": {
    "port": {
      "type": "integer",
      "description": "Loopback host port; connect through an SSH tunnel or an authenticated reverse proxy.",
      "default": 15672,
      "min": 1,
      "max": 65535
    }
  },
  "resources": {
    "specs": "auto",
    "cpu": 2,
    "ram_gb": 2,
    "storage_gb": 30,
    "ingress": [
      {
        "port": 15672,
        "protocol": "tcp",
        "source": "loopback"
      }
    ]
  },
  "steps": [
    {
      "id": "install-docker",
      "type": "package",
      "package": "docker.io"
    },
    {
      "id": "install-openssl",
      "type": "package",
      "package": "openssl"
    },
    {
      "id": "start-rabbitmq",
      "type": "command",
      "command": "recipe='rabbitmq'\nowned_volume() {\n  if docker volume inspect \"$1\" >/dev/null 2>&1; then\n    owner=$(docker volume inspect -f '{{ index .Labels \"infinity-iac-recipe\" }}' \"$1\")\n    [ \"$owner\" = \"$recipe\" ] || { printf '%s\\n' 'Refusing unowned volume' >&2; exit 1; }\n  else\n    docker volume create --label \"infinity-iac-recipe=$recipe\" \"$1\" >/dev/null\n  fi\n}\nreplace_container() {\n  if docker inspect \"$1\" >/dev/null 2>&1; then\n    owner=$(docker inspect -f '{{ index .Config.Labels \"infinity-iac-recipe\" }}' \"$1\")\n    [ \"$owner\" = \"$recipe\" ] || { printf '%s\\n' 'Refusing unowned container' >&2; exit 1; }\n    docker rm -f \"$1\" >/dev/null\n  fi\n}\nowned_volume 'infinity-rabbitmq-data'\ninstall -d -m 0700 /var/lib/infinity-iac/rabbitmq\ncredentials=/var/lib/infinity-iac/rabbitmq/credentials.env\ntest ! -L \"$credentials\"\nif [ ! -e \"$credentials\" ]; then\n  umask 077\n  tmp=$(mktemp \"${credentials}.XXXXXX\")\n  trap 'rm -f -- \"$tmp\"' EXIT\n  printf '%s=%s\\n' 'RABBITMQ_DEFAULT_USER' \"infinity\" >> \"$tmp\"\n  printf '%s=%s\\n' 'RABBITMQ_DEFAULT_PASS' \"$(openssl rand -hex 32)\" >> \"$tmp\"\n  chmod 0600 \"$tmp\"\n  mv -- \"$tmp\" \"$credentials\"\n  trap - EXIT\nfi\nchmod 0600 \"$credentials\"\nreplace_container rabbitmq\ndocker run -d --restart unless-stopped --label infinity-iac-recipe=rabbitmq --name rabbitmq -v infinity-rabbitmq-data:/var/lib/rabbitmq --env-file \"$credentials\" --hostname infinity-rabbitmq -p 127.0.0.1:{{port}}:15672 rabbitmq:4.4-management-alpine\n",
      "timeout_seconds": 1200
    }
  ],
  "health": [
    {
      "type": "command",
      "command": "docker exec rabbitmq rabbitmq-diagnostics -q check_running && docker exec rabbitmq rabbitmq-diagnostics -q check_port_connectivity",
      "timeout_seconds": 240
    }
  ],
  "outputs": {
    "url": {
      "type": "string",
      "value": "http://127.0.0.1:{{port}}"
    },
    "credentials_file": {
      "type": "string",
      "value": "/var/lib/infinity-iac/rabbitmq/credentials.env",
      "sensitive": true
    }
  },
  "status": "experimental",
  "requirements": [
    "Only the management UI is mapped to loopback. Configure a separate deliberate AMQP mapping for clients.",
    "Bootstrap credentials are persisted privately on the instance."
  ]
}
