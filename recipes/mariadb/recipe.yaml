{
  "api_version": "recipe/v1",
  "version": "1.1.0",
  "kind": "application",
  "supports": {
    "providers": [
      "oracle"
    ],
    "os": [
      "ubuntu-24.04",
      "ubuntu-22.04"
    ],
    "architectures": [
      "amd64",
      "arm64"
    ]
  },
  "name": "mariadb",
  "description": "MariaDB relational database.",
  "inputs": {
    "port": {
      "type": "integer",
      "description": "Loopback host port; use an SSH tunnel or an authenticated reverse proxy.",
      "default": 3306,
      "min": 1,
      "max": 65535
    }
  },
  "resources": {
    "specs": "ibase2",
    "cpu": 2,
    "ram_gb": 2,
    "storage_gb": 30,
    "ingress": [
      {
        "port": 3306,
        "protocol": "tcp",
        "source": "loopback"
      }
    ]
  },
  "steps": [
    {
      "id": "install-docker",
      "type": "package",
      "package": "docker.io"
    },
    {
      "id": "install-openssl",
      "type": "package",
      "package": "openssl"
    },
    {
      "id": "start-mariadb",
      "type": "command",
      "command": "umask 077\ninstall -d -m 0700 /var/lib/infinity-iac/mariadb\nif [ ! -s /var/lib/infinity-iac/mariadb/credentials.env ]; then\n  printf 'MARIADB_ROOT_PASSWORD=%s\\n' \"$(openssl rand -hex 24)\" > /var/lib/infinity-iac/mariadb/credentials.env.tmp\n  mv /var/lib/infinity-iac/mariadb/credentials.env.tmp /var/lib/infinity-iac/mariadb/credentials.env\nfi\nchmod 0600 /var/lib/infinity-iac/mariadb/credentials.env\nif docker volume inspect infinity-mariadb-data >/dev/null 2>&1; then\n  owner=$(docker volume inspect -f '{{ index .Labels \"infinity-iac-recipe\" }}' infinity-mariadb-data)\n  [ \"$owner\" = mariadb ] || { echo \"Refusing unowned volume\" >&2; exit 1; }\nelse\n  docker volume create --label infinity-iac-recipe=mariadb infinity-mariadb-data >/dev/null\nfi\nif docker inspect mariadb >/dev/null 2>&1; then\n  owner=$(docker inspect -f '{{ index .Config.Labels \"infinity-iac-recipe\" }}' mariadb)\n  [ \"$owner\" = mariadb ] || { echo \"Refusing unowned container\" >&2; exit 1; }\n  docker rm -f mariadb >/dev/null\nfi\ndocker run -d --restart unless-stopped --name mariadb --label infinity-iac-recipe=mariadb --env-file /var/lib/infinity-iac/mariadb/credentials.env -v infinity-mariadb-data:/var/lib/mysql -p 127.0.0.1:{{port}}:3306 mariadb:11.4",
      "timeout_seconds": 900
    }
  ],
  "health": [
    {
      "type": "command",
      "command": "docker exec mariadb sh -c 'MYSQL_PWD=\"$MARIADB_ROOT_PASSWORD\" mariadb -h 127.0.0.1 -uroot -N -e \"SELECT 1\"' | grep -qx 1",
      "timeout_seconds": 300
    }
  ],
  "outputs": {
    "credentials_file": {
      "type": "string",
      "value": "/var/lib/infinity-iac/mariadb/credentials.env",
      "sensitive": true
    }
  },
  "status": "experimental"
}
