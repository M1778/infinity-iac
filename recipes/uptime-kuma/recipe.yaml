{
  "api_version": "recipe/v1",
  "version": "1.1.0",
  "kind": "application",
  "supports": {
    "providers": [
      "oracle"
    ],
    "os": [
      "ubuntu-24.04",
      "ubuntu-22.04"
    ],
    "architectures": [
      "amd64",
      "arm64"
    ]
  },
  "name": "uptime-kuma",
  "description": "Self-hosted uptime monitor.",
  "inputs": {
    "port": {
      "type": "integer",
      "description": "Loopback host port; use an SSH tunnel or an authenticated reverse proxy.",
      "default": 3001,
      "min": 1,
      "max": 65535
    }
  },
  "resources": {
    "specs": "ibase2",
    "cpu": 2,
    "ram_gb": 2,
    "storage_gb": 30,
    "ingress": [
      {
        "port": 3001,
        "protocol": "tcp",
        "source": "loopback"
      }
    ]
  },
  "steps": [
    {
      "id": "install-docker",
      "type": "package",
      "package": "docker.io"
    },
    {
      "id": "start-uptime-kuma",
      "type": "command",
      "command": "if docker volume inspect infinity-uptime-kuma-data >/dev/null 2>&1; then\n  owner=$(docker volume inspect -f '{{ index .Labels \"infinity-iac-recipe\" }}' infinity-uptime-kuma-data)\n  [ \"$owner\" = uptime-kuma ] || { echo \"Refusing unowned volume\" >&2; exit 1; }\nelse\n  docker volume create --label infinity-iac-recipe=uptime-kuma infinity-uptime-kuma-data >/dev/null\nfi\nif docker inspect uptime_kuma >/dev/null 2>&1; then\n  owner=$(docker inspect -f '{{ index .Config.Labels \"infinity-iac-recipe\" }}' uptime_kuma)\n  [ \"$owner\" = uptime-kuma ] || { echo \"Refusing unowned container\" >&2; exit 1; }\n  docker rm -f uptime_kuma >/dev/null\nfi\ndocker run -d --restart unless-stopped --name uptime_kuma --label infinity-iac-recipe=uptime-kuma -v infinity-uptime-kuma-data:/app/data -p 127.0.0.1:{{port}}:3001 louislam/uptime-kuma:2",
      "timeout_seconds": 900
    }
  ],
  "health": [
    {
      "type": "http",
      "port": 3001,
      "path": "/",
      "timeout_seconds": 180
    }
  ],
  "outputs": {
    "url": {
      "type": "string",
      "value": "http://127.0.0.1:{{port}}"
    }
  },
  "status": "experimental"
}
