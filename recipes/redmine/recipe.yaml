{
  "api_version": "recipe/v1",
  "version": "1.1.0",
  "kind": "application",
  "supports": {
    "providers": [
      "oracle"
    ],
    "os": [
      "ubuntu-24.04",
      "ubuntu-22.04"
    ],
    "architectures": [
      "amd64",
      "arm64"
    ]
  },
  "name": "redmine",
  "description": "Project management.",
  "inputs": {
    "port": {
      "type": "integer",
      "description": "Loopback host port; connect through an SSH tunnel or an authenticated reverse proxy.",
      "default": 3000,
      "min": 1,
      "max": 65535
    }
  },
  "resources": {
    "specs": "auto",
    "cpu": 2,
    "ram_gb": 3,
    "storage_gb": 30,
    "ingress": [
      {
        "port": 3000,
        "protocol": "tcp",
        "source": "loopback"
      }
    ]
  },
  "steps": [
    {
      "id": "install-docker",
      "type": "package",
      "package": "docker.io"
    },
    {
      "id": "install-openssl",
      "type": "package",
      "package": "openssl"
    },
    {
      "id": "start-redmine-stack",
      "type": "command",
      "command": "recipe='redmine'\nowned_volume() {\n  if docker volume inspect \"$1\" >/dev/null 2>&1; then\n    owner=$(docker volume inspect -f '{{ index .Labels \"infinity-iac-recipe\" }}' \"$1\")\n    [ \"$owner\" = \"$recipe\" ] || { printf '%s\\n' 'Refusing unowned volume' >&2; exit 1; }\n  else\n    docker volume create --label \"infinity-iac-recipe=$recipe\" \"$1\" >/dev/null\n  fi\n}\nowned_network() {\n  if docker network inspect \"$1\" >/dev/null 2>&1; then\n    owner=$(docker network inspect -f '{{ index .Labels \"infinity-iac-recipe\" }}' \"$1\")\n    [ \"$owner\" = \"$recipe\" ] || { printf '%s\\n' 'Refusing unowned network' >&2; exit 1; }\n  else\n    docker network create --label \"infinity-iac-recipe=$recipe\" \"$1\" >/dev/null\n  fi\n}\nreplace_container() {\n  if docker inspect \"$1\" >/dev/null 2>&1; then\n    owner=$(docker inspect -f '{{ index .Config.Labels \"infinity-iac-recipe\" }}' \"$1\")\n    [ \"$owner\" = \"$recipe\" ] || { printf '%s\\n' 'Refusing unowned container' >&2; exit 1; }\n    docker rm -f \"$1\" >/dev/null\n  fi\n}\nwait_for() {\n  local deadline=$((SECONDS + 180))\n  until \"$@\" >/dev/null 2>&1; do\n    (( SECONDS < deadline )) || { printf '%s\\n' 'Dependency readiness timed out' >&2; exit 1; }\n    sleep 3\n  done\n}\nowned_network infinity-redmine-network\nowned_volume infinity-redmine-database\nowned_volume infinity-redmine-files\ninstall -d -m 0700 /var/lib/infinity-iac/redmine\ncredentials=/var/lib/infinity-iac/redmine/credentials.env\ntest ! -L \"$credentials\"\nif [ ! -e \"$credentials\" ]; then\n  umask 077\n  tmp=$(mktemp \"${credentials}.XXXXXX\")\n  trap 'rm -f -- \"$tmp\"' EXIT\n  printf '%s=%s\\n' 'MARIADB_ROOT_PASSWORD' \"$(openssl rand -hex 32)\" >> \"$tmp\"\n  printf '%s=%s\\n' 'MARIADB_USER' \"infinity\" >> \"$tmp\"\n  printf '%s=%s\\n' 'MARIADB_DATABASE' \"infinity\" >> \"$tmp\"\n  printf '%s=%s\\n' 'MARIADB_PASSWORD' \"$(openssl rand -hex 32)\" >> \"$tmp\"\n  chmod 0600 \"$tmp\"\n  mv -- \"$tmp\" \"$credentials\"\n  trap - EXIT\nfi\nchmod 0600 \"$credentials\"\nset -a\n. \"$credentials\"\nset +a\nreplace_container redmine\nreplace_container infinity-redmine-db\ndatabase_env=$credentials\ndocker run -d --restart unless-stopped --label infinity-iac-recipe=redmine --name infinity-redmine-db --network infinity-redmine-network -v infinity-redmine-database:/var/lib/mysql --env-file \"$database_env\" mariadb@sha256:d1891ede5a559f1086f55053bb8cc1569b0298338c4d72d71725a7f74f6ba620\nwait_for docker exec infinity-redmine-db sh -ec 'MYSQL_PWD=\"$MARIADB_ROOT_PASSWORD\" mariadb -h 127.0.0.1 -uroot -Nse \"SELECT 1\"'\ndocker run -d --restart unless-stopped --label infinity-iac-recipe=redmine --name redmine --network infinity-redmine-network -v infinity-redmine-files:/usr/src/redmine/files -e REDMINE_DB_MYSQL=\"infinity-redmine-db\" -e REDMINE_DB_USERNAME=\"$MARIADB_USER\" -e REDMINE_DB_PASSWORD=\"$MARIADB_PASSWORD\" -e REDMINE_DB_DATABASE=\"$MARIADB_DATABASE\" -p 127.0.0.1:{{port}}:3000 redmine:7\n",
      "timeout_seconds": 1500
    }
  ],
  "health": [
    {
      "type": "http",
      "port": 3000,
      "path": "/",
      "timeout_seconds": 300
    }
  ],
  "outputs": {
    "url": {
      "type": "string",
      "value": "http://127.0.0.1:{{port}}"
    },
    "credentials_file": {
      "type": "string",
      "value": "/var/lib/infinity-iac/redmine/credentials.env",
      "sensitive": true
    }
  },
  "status": "experimental",
  "requirements": [
    "Change the upstream administrator password immediately through the SSH tunnel; the database and uploaded files have separate persistent volumes."
  ]
}
