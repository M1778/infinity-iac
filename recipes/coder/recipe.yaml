{
  "api_version": "recipe/v1",
  "version": "1.1.0",
  "kind": "application",
  "supports": {
    "providers": [
      "oracle"
    ],
    "os": [
      "ubuntu-24.04",
      "ubuntu-22.04"
    ],
    "architectures": [
      "amd64",
      "arm64"
    ]
  },
  "name": "coder",
  "description": "Cloud development environments.",
  "inputs": {
    "port": {
      "type": "integer",
      "description": "Loopback host port; connect through an SSH tunnel or an authenticated reverse proxy.",
      "default": 7080,
      "min": 1,
      "max": 65535
    }
  },
  "resources": {
    "specs": "auto",
    "cpu": 2,
    "ram_gb": 3,
    "storage_gb": 30,
    "ingress": [
      {
        "port": 7080,
        "protocol": "tcp",
        "source": "loopback"
      }
    ]
  },
  "steps": [
    {
      "id": "install-docker",
      "type": "package",
      "package": "docker.io"
    },
    {
      "id": "install-openssl",
      "type": "package",
      "package": "openssl"
    },
    {
      "id": "start-coder-stack",
      "type": "command",
      "command": "recipe='coder'\nowned_volume() {\n  if docker volume inspect \"$1\" >/dev/null 2>&1; then\n    owner=$(docker volume inspect -f '{{ index .Labels \"infinity-iac-recipe\" }}' \"$1\")\n    [ \"$owner\" = \"$recipe\" ] || { printf '%s\\n' 'Refusing unowned volume' >&2; exit 1; }\n  else\n    docker volume create --label \"infinity-iac-recipe=$recipe\" \"$1\" >/dev/null\n  fi\n}\nowned_network() {\n  if docker network inspect \"$1\" >/dev/null 2>&1; then\n    owner=$(docker network inspect -f '{{ index .Labels \"infinity-iac-recipe\" }}' \"$1\")\n    [ \"$owner\" = \"$recipe\" ] || { printf '%s\\n' 'Refusing unowned network' >&2; exit 1; }\n  else\n    docker network create --label \"infinity-iac-recipe=$recipe\" \"$1\" >/dev/null\n  fi\n}\nreplace_container() {\n  if docker inspect \"$1\" >/dev/null 2>&1; then\n    owner=$(docker inspect -f '{{ index .Config.Labels \"infinity-iac-recipe\" }}' \"$1\")\n    [ \"$owner\" = \"$recipe\" ] || { printf '%s\\n' 'Refusing unowned container' >&2; exit 1; }\n    docker rm -f \"$1\" >/dev/null\n  fi\n}\nwait_for() {\n  local deadline=$((SECONDS + 180))\n  until \"$@\" >/dev/null 2>&1; do\n    (( SECONDS < deadline )) || { printf '%s\\n' 'Dependency readiness timed out' >&2; exit 1; }\n    sleep 3\n  done\n}\nowned_network infinity-coder-network\nowned_volume infinity-coder-database\nowned_volume infinity-coder-home\ninstall -d -m 0700 /var/lib/infinity-iac/coder\ncredentials=/var/lib/infinity-iac/coder/credentials.env\ntest ! -L \"$credentials\"\nif [ ! -e \"$credentials\" ]; then\n  umask 077\n  tmp=$(mktemp \"${credentials}.XXXXXX\")\n  trap 'rm -f -- \"$tmp\"' EXIT\n  printf '%s=%s\\n' 'POSTGRES_USER' \"infinity\" >> \"$tmp\"\n  printf '%s=%s\\n' 'POSTGRES_DB' \"infinity\" >> \"$tmp\"\n  printf '%s=%s\\n' 'POSTGRES_PASSWORD' \"$(openssl rand -hex 32)\" >> \"$tmp\"\n  chmod 0600 \"$tmp\"\n  mv -- \"$tmp\" \"$credentials\"\n  trap - EXIT\nfi\nchmod 0600 \"$credentials\"\nset -a\n. \"$credentials\"\nset +a\nreplace_container coder\nreplace_container infinity-coder-db\ndocker run -d --restart unless-stopped --label infinity-iac-recipe=coder --name infinity-coder-db --network infinity-coder-network -v infinity-coder-database:/var/lib/postgresql/data --env-file \"$credentials\" postgres:16-alpine\nwait_for docker exec infinity-coder-db sh -ec 'PGPASSWORD=\"$POSTGRES_PASSWORD\" psql -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -Atqc \"SELECT 1\"'\ndocker run -d --restart unless-stopped --label infinity-iac-recipe=coder --name coder --network infinity-coder-network -v infinity-coder-home:/home/coder -e CODER_PG_CONNECTION_URL=\"postgres://$POSTGRES_USER:$POSTGRES_PASSWORD@infinity-coder-db:5432/$POSTGRES_DB?sslmode=disable\" -e CODER_HTTP_ADDRESS=\"0.0.0.0:7080\" -e CODER_ACCESS_URL=\"http://localhost:{{port}}\" -p 127.0.0.1:{{port}}:7080 ghcr.io/coder/coder:latest\n",
      "timeout_seconds": 1500
    }
  ],
  "health": [
    {
      "type": "http",
      "port": 7080,
      "path": "/healthz",
      "timeout_seconds": 300
    }
  ],
  "outputs": {
    "url": {
      "type": "string",
      "value": "http://127.0.0.1:{{port}}"
    },
    "credentials_file": {
      "type": "string",
      "value": "/var/lib/infinity-iac/coder/credentials.env",
      "sensitive": true
    }
  },
  "status": "experimental",
  "requirements": [
    "Control-plane evaluation with private PostgreSQL and explicit listener/access URL; complete first-administrator onboarding.",
    "Workspace templates/provisioners and their credentials are not bundled; no privileged Docker socket is mounted."
  ]
}
