{
  "api_version": "recipe/v1",
  "version": "1.1.0",
  "kind": "application",
  "supports": {
    "providers": [
      "oracle"
    ],
    "os": [
      "ubuntu-24.04",
      "ubuntu-22.04"
    ],
    "architectures": [
      "amd64",
      "arm64"
    ]
  },
  "name": "mysql",
  "description": "MySQL relational database.",
  "inputs": {
    "port": {
      "type": "integer",
      "description": "Loopback host port; use an SSH tunnel or an authenticated reverse proxy.",
      "default": 3306,
      "min": 1,
      "max": 65535
    }
  },
  "resources": {
    "specs": "ibase2",
    "cpu": 2,
    "ram_gb": 2,
    "storage_gb": 30,
    "ingress": [
      {
        "port": 3306,
        "protocol": "tcp",
        "source": "loopback"
      }
    ]
  },
  "steps": [
    {
      "id": "install-docker",
      "type": "package",
      "package": "docker.io"
    },
    {
      "id": "install-openssl",
      "type": "package",
      "package": "openssl"
    },
    {
      "id": "start-mysql",
      "type": "command",
      "command": "umask 077\ninstall -d -m 0700 /var/lib/infinity-iac/mysql\nif [ ! -s /var/lib/infinity-iac/mysql/credentials.env ]; then\n  printf 'MYSQL_ROOT_PASSWORD=%s\\n' \"$(openssl rand -hex 24)\" > /var/lib/infinity-iac/mysql/credentials.env.tmp\n  mv /var/lib/infinity-iac/mysql/credentials.env.tmp /var/lib/infinity-iac/mysql/credentials.env\nfi\nchmod 0600 /var/lib/infinity-iac/mysql/credentials.env\nif docker volume inspect infinity-mysql-data >/dev/null 2>&1; then\n  owner=$(docker volume inspect -f '{{ index .Labels \"infinity-iac-recipe\" }}' infinity-mysql-data)\n  [ \"$owner\" = mysql ] || { echo \"Refusing unowned volume\" >&2; exit 1; }\nelse\n  docker volume create --label infinity-iac-recipe=mysql infinity-mysql-data >/dev/null\nfi\nif docker inspect mysql >/dev/null 2>&1; then\n  owner=$(docker inspect -f '{{ index .Config.Labels \"infinity-iac-recipe\" }}' mysql)\n  [ \"$owner\" = mysql ] || { echo \"Refusing unowned container\" >&2; exit 1; }\n  docker rm -f mysql >/dev/null\nfi\ndocker run -d --restart unless-stopped --name mysql --label infinity-iac-recipe=mysql --env-file /var/lib/infinity-iac/mysql/credentials.env -v infinity-mysql-data:/var/lib/mysql -p 127.0.0.1:{{port}}:3306 mysql:8.4",
      "timeout_seconds": 900
    }
  ],
  "health": [
    {
      "type": "command",
      "command": "docker exec mysql sh -c 'MYSQL_PWD=\"$MYSQL_ROOT_PASSWORD\" mysql -h 127.0.0.1 -uroot -N -e \"SELECT 1\"' | grep -qx 1",
      "timeout_seconds": 300
    }
  ],
  "outputs": {
    "credentials_file": {
      "type": "string",
      "value": "/var/lib/infinity-iac/mysql/credentials.env",
      "sensitive": true
    }
  },
  "status": "experimental"
}
