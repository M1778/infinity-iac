{
  "api_version": "recipe/v1",
  "version": "1.1.0",
  "kind": "application",
  "supports": {
    "providers": [
      "oracle"
    ],
    "os": [
      "ubuntu-24.04",
      "ubuntu-22.04"
    ],
    "architectures": []
  },
  "name": "rundeck",
  "description": "Runbook automation.",
  "inputs": {
    "port": {
      "type": "integer",
      "description": "Loopback host port reserved for a completed deployment; this integration remains blocked.",
      "default": 4440,
      "min": 1,
      "max": 65535
    }
  },
  "resources": {
    "specs": "ibase2",
    "cpu": 2,
    "ram_gb": 2,
    "storage_gb": 30,
    "ingress": [
      {
        "port": 4440,
        "protocol": "tcp",
        "source": "loopback"
      }
    ]
  },
  "steps": [
    {
      "id": "require-supported-deployment",
      "type": "command",
      "command": "printf '%s\\n' 'rundeck: deployment prerequisites are not yet implemented; inspect recipe requirements.' >&2; exit 1",
      "timeout_seconds": 10
    }
  ],
  "health": [],
  "outputs": {},
  "status": "template",
  "requirements": [
    "Deploy supported Rundeck with a durable application database and persistent project/plugin/data paths; configure URL, login credentials and encryption settings.",
    "Provide only approved job-runner credentials/targets, configure TLS and verify scheduler plus authenticated API readiness."
  ]
}
