{
  "api_version": "recipe/v1",
  "version": "1.1.0",
  "kind": "application",
  "supports": {
    "providers": [
      "oracle"
    ],
    "os": [
      "ubuntu-24.04",
      "ubuntu-22.04"
    ],
    "architectures": [
      "amd64",
      "arm64"
    ]
  },
  "name": "wordpress",
  "description": "Publishing and CMS platform.",
  "inputs": {
    "port": {
      "type": "integer",
      "description": "Loopback host port; connect through an SSH tunnel or an authenticated reverse proxy.",
      "default": 8080,
      "min": 1,
      "max": 65535
    }
  },
  "resources": {
    "specs": "auto",
    "cpu": 2,
    "ram_gb": 3,
    "storage_gb": 30,
    "ingress": [
      {
        "port": 8080,
        "protocol": "tcp",
        "source": "loopback"
      }
    ]
  },
  "steps": [
    {
      "id": "install-docker",
      "type": "package",
      "package": "docker.io"
    },
    {
      "id": "install-openssl",
      "type": "package",
      "package": "openssl"
    },
    {
      "id": "start-wordpress-stack",
      "type": "command",
      "command": "recipe='wordpress'\nowned_volume() {\n  if docker volume inspect \"$1\" >/dev/null 2>&1; then\n    owner=$(docker volume inspect -f '{{ index .Labels \"infinity-iac-recipe\" }}' \"$1\")\n    [ \"$owner\" = \"$recipe\" ] || { printf '%s\\n' 'Refusing unowned volume' >&2; exit 1; }\n  else\n    docker volume create --label \"infinity-iac-recipe=$recipe\" \"$1\" >/dev/null\n  fi\n}\nowned_network() {\n  if docker network inspect \"$1\" >/dev/null 2>&1; then\n    owner=$(docker network inspect -f '{{ index .Labels \"infinity-iac-recipe\" }}' \"$1\")\n    [ \"$owner\" = \"$recipe\" ] || { printf '%s\\n' 'Refusing unowned network' >&2; exit 1; }\n  else\n    docker network create --label \"infinity-iac-recipe=$recipe\" \"$1\" >/dev/null\n  fi\n}\nreplace_container() {\n  if docker inspect \"$1\" >/dev/null 2>&1; then\n    owner=$(docker inspect -f '{{ index .Config.Labels \"infinity-iac-recipe\" }}' \"$1\")\n    [ \"$owner\" = \"$recipe\" ] || { printf '%s\\n' 'Refusing unowned container' >&2; exit 1; }\n    docker rm -f \"$1\" >/dev/null\n  fi\n}\nwait_for() {\n  local deadline=$((SECONDS + 180))\n  until \"$@\" >/dev/null 2>&1; do\n    (( SECONDS < deadline )) || { printf '%s\\n' 'Dependency readiness timed out' >&2; exit 1; }\n    sleep 3\n  done\n}\nowned_network infinity-wordpress-network\nowned_volume infinity-wordpress-database\nowned_volume infinity-wordpress-data\ninstall -d -m 0700 /var/lib/infinity-iac/wordpress\ncredentials=/var/lib/infinity-iac/wordpress/credentials.env\ntest ! -L \"$credentials\"\nif [ ! -e \"$credentials\" ]; then\n  umask 077\n  tmp=$(mktemp \"${credentials}.XXXXXX\")\n  trap 'rm -f -- \"$tmp\"' EXIT\n  printf '%s=%s\\n' 'MARIADB_ROOT_PASSWORD' \"$(openssl rand -hex 32)\" >> \"$tmp\"\n  printf '%s=%s\\n' 'MARIADB_USER' \"infinity\" >> \"$tmp\"\n  printf '%s=%s\\n' 'MARIADB_DATABASE' \"infinity\" >> \"$tmp\"\n  printf '%s=%s\\n' 'MARIADB_PASSWORD' \"$(openssl rand -hex 32)\" >> \"$tmp\"\n  chmod 0600 \"$tmp\"\n  mv -- \"$tmp\" \"$credentials\"\n  trap - EXIT\nfi\nchmod 0600 \"$credentials\"\nset -a\n. \"$credentials\"\nset +a\nreplace_container wordpress\nreplace_container infinity-wordpress-db\ndatabase_env=$credentials\ndocker run -d --restart unless-stopped --label infinity-iac-recipe=wordpress --name infinity-wordpress-db --network infinity-wordpress-network -v infinity-wordpress-database:/var/lib/mysql --env-file \"$database_env\" mariadb@sha256:d1891ede5a559f1086f55053bb8cc1569b0298338c4d72d71725a7f74f6ba620\nwait_for docker exec infinity-wordpress-db sh -ec 'MYSQL_PWD=\"$MARIADB_ROOT_PASSWORD\" mariadb -h 127.0.0.1 -uroot -Nse \"SELECT 1\"'\ndocker run -d --restart unless-stopped --label infinity-iac-recipe=wordpress --name wordpress --network infinity-wordpress-network -v infinity-wordpress-data:/var/www/html -e WORDPRESS_DB_HOST=\"infinity-wordpress-db:3306\" -e WORDPRESS_DB_USER=\"$MARIADB_USER\" -e WORDPRESS_DB_PASSWORD=\"$MARIADB_PASSWORD\" -e WORDPRESS_DB_NAME=\"$MARIADB_DATABASE\" -p 127.0.0.1:{{port}}:80 wordpress:7.1-php8.3-apache\n",
      "timeout_seconds": 1500
    }
  ],
  "health": [
    {
      "type": "http",
      "port": 8080,
      "path": "/",
      "timeout_seconds": 300
    }
  ],
  "outputs": {
    "url": {
      "type": "string",
      "value": "http://127.0.0.1:{{port}}"
    },
    "credentials_file": {
      "type": "string",
      "value": "/var/lib/infinity-iac/wordpress/credentials.env",
      "sensitive": true
    }
  },
  "status": "experimental",
  "requirements": [
    "Persistent isolated MariaDB and WordPress; complete the site installer over the SSH tunnel and configure HTTPS before publication."
  ]
}
