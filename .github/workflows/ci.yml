name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache: true

      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l ./cmd ./internal ./recipes ./infinityiac.go ./infinityiac_test.go)"

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Build
        shell: bash
        run: |
          mkdir -p dist
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          go build -trimpath -ldflags="-s -w" -o "dist/infinity-iac-${{ runner.os }}-${{ runner.arch }}${ext}" ./cmd/infinity-iac

      - name: Validate recipe catalog
        shell: bash
        run: go run ./cmd/infinity-iac list recipes --output json

      - name: Check Unix installer
        shell: bash
        run: |
          sh -n install.sh
          ./install.sh --help

      - name: Check release verifier
        shell: bash
        run: sh -n scripts/verify-release.sh

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = go run ./cmd/infinity-iac --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { $iscc = 'iscc.exe' }
          & $iscc "/DAppVersion=$($version.Trim())" "/DSourceBinary=$((Resolve-Path 'dist/infinity-iac-Windows-X64.exe').Path)" installer/infinity-iac.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test Windows installation and uninstallation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = go run ./cmd/infinity-iac --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/windows-installer-smoke.ps1 -Installer dist/infinity-iac-setup.exe -Version $version.Trim()

      - name: Upload CI binary
        uses: actions/upload-artifact@v7
        with:
          name: ci-${{ runner.os }}-${{ runner.arch }}
          path: dist/*

  docs-test:
    name: Documentation browser tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache: true

      - name: Verify public catalog is current
        run: go run ./cmd/docs-data --check

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install browser test dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Test documentation
        run: npm run test:docs

      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: documentation-browser-report
          path: playwright-report/
          retention-days: 7
