name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache: true

      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l ./cmd ./internal ./recipes)"

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Build
        shell: bash
        run: |
          mkdir -p dist
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          go build -trimpath -ldflags="-s -w" -o "dist/infinity-iac-${{ runner.os }}-${{ runner.arch }}${ext}" ./cmd/infinity-iac

      - name: Validate recipe catalog
        shell: bash
        run: go run ./cmd/infinity-iac list recipes --output json

      - name: Check Unix installer
        shell: bash
        run: |
          sh -n install.sh
          ./install.sh --help

      - name: Check release verifier
        shell: bash
        run: sh -n scripts/verify-release.sh

      - name: Upload CI binary
        uses: actions/upload-artifact@v4
        with:
          name: ci-${{ runner.os }}-${{ runner.arch }}
          path: dist/*
